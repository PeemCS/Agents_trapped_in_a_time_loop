<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#0b1018"/>

  <!-- Header -->
  <text x="44" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.5">CHERRY TREE INN — BEDROOM BLOCKING DIAGRAM (OVERHEAD)</text>
  <text x="44" y="72" fill="#94a3b8" font-size="13">ORIENTATION: PHIL-FORWARD-UP (Headboard at Bottom · Bay Windows Ahead · Nightstand/Alarm at 95° to Phil's LEFT)</text>

  <!-- Room Footprint (Octagonal Bay Front Wall) -->
  <polygon points="150,240 280,120 620,120 750,240 750,730 150,730" fill="#131c2b" stroke="#475569" stroke-width="4"/>
  <polygon points="160,245 285,130 615,130 740,245 740,720 160,720" fill="none" stroke="#854d0e" stroke-width="2" stroke-dasharray="6 4" opacity="0.65"/>

  <!-- THREE ARCHED BAY WINDOWS (TOP WALL) -->
  <line x1="178" y1="215" x2="256" y2="143" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="168" y="158" fill="#bae6fd" font-size="11" text-anchor="middle">FROSTED BAY</text>
  <text x="168" y="172" fill="#bae6fd" font-size="11" text-anchor="middle">WINDOW #1</text>

  <line x1="365" y1="120" x2="535" y2="120" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="450" y="102" fill="#bae6fd" font-size="11" text-anchor="middle">FROSTED BAY WINDOW #2 (CENTER)</text>

  <line x1="644" y1="143" x2="722" y2="215" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="735" y="158" fill="#bae6fd" font-size="11" text-anchor="middle">FROSTED BAY</text>
  <text x="735" y="172" fill="#bae6fd" font-size="11" text-anchor="middle">WINDOW #3</text>

  <!-- Right Wall: Door & Floor Lamp -->
  <line x1="750" y1="520" x2="750" y2="620" stroke="#cbd5e1" stroke-width="8"/>
  <path d="M 750 520 A 90 90 0 0 0 660 610" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="708" y="504" fill="#94a3b8" font-size="11" text-anchor="middle">HALL DOOR</text>

  <circle cx="705" cy="680" r="18" fill="#334155" stroke="#a16207" stroke-width="2"/>
  <text x="705" y="684" fill="#e2e8f0" font-size="9" text-anchor="middle">LAMP</text>

  <!-- Antique Rocking Chair (Front-Right Corner) -->
  <rect x="640" y="255" width="76" height="68" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="678" y="293" fill="#94a3b8" font-size="10" text-anchor="middle">ROCKING</text>
  <text x="678" y="306" fill="#94a3b8" font-size="10" text-anchor="middle">CHAIR</text>

  <!-- CAMERA 1 FOV CONE (STRAIGHT AHEAD — NO ALARM VISIBLE!) -->
  <path d="M 450,625 L 215,165 L 685,165 Z" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="450" y1="625" x2="450" y2="210" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- CAMERA 2 FOV CONE (TURNING 95° LEFT — REVEALS ALARM!) -->
  <path d="M 450,625 L 185,485 L 165,715 Z" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="450" y1="625" x2="275" y2="625" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- CAMERA 3 (3RD PERSON DEPRESSION WIDE ANGLE — TOP RIGHT) -->
  <circle cx="675" cy="365" r="10" fill="#f472b6"/>
  <line x1="665" y1="375" x2="485" y2="540" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowPink)"/>
  <text x="648" y="348" fill="#f472b6" font-size="11" font-weight="700" text-anchor="middle">CAM 3 (3RD PERSON)</text>

  <!-- HEADBOARD (BOTTOM WALL) -->
  <rect x="315" y="704" width="270" height="22" rx="3" fill="#451a03" stroke="#92400e" stroke-width="2"/>
  <text x="450" y="752" fill="#d6d3d1" font-size="12" font-weight="700" text-anchor="middle">DARK MAHOGANY EASTLAKE HEADBOARD (BEHIND PHIL'S HEAD)</text>

  <!-- DOUBLE BED -->
  <rect x="325" y="425" width="250" height="279" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="331" y="431" width="238" height="175" rx="5" fill="#312e81" fill-opacity="0.35" stroke="#f9a8d4" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="450" y="515" fill="#f9a8d4" font-size="12" text-anchor="middle">FLORAL PATCHWORK QUILT</text>
  <text x="450" y="532" fill="#cbd5e1" font-size="11" text-anchor="middle">(Phil's legs pointing UP ↑)</text>

  <!-- Pillows -->
  <rect x="342" y="622" width="102" height="62" rx="10" fill="#4c1d3d" stroke="#f9a8d4" stroke-width="1.5"/>
  <rect x="456" y="622" width="102" height="62" rx="10" fill="#4c1d3d" stroke="#f9a8d4" stroke-width="1.5"/>

  <!-- PHIL'S HEAD / EYE POSITION -->
  <circle cx="450" cy="625" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="450" cy="617" r="4" fill="#38bdf8"/>
  <text x="450" y="662" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">PHIL'S EYES (POV)</text>

  <!-- NIGHTSTAND ON PHIL'S LEFT (95° LEFT — MATCHES 1993 MOVIE & OUT OF CAM 1 FRAME!) -->
  <circle cx="238" cy="632" r="58" fill="url(#clockGlow)"/>
  <rect x="188" y="582" width="96" height="96" rx="6" fill="#422006" stroke="#b45309" stroke-width="2.5"/>
  <rect x="195" y="589" width="82" height="82" rx="4" fill="none" stroke="#f8fafc" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.8"/>

  <!-- Panasonic RC-6025 Clock (angled toward Phil's pillow on right) -->
  <g transform="translate(248, 634) rotate(78)">
    <rect x="-24" y="-12" width="48" height="24" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <rect x="-18" y="-9" width="36" height="10" fill="#020617"/>
    <text x="0" y="-1" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">6:00</text>
  </g>
  <!-- Lamp behind clock -->
  <circle cx="212" cy="656" r="13" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
  <!-- Pink roses bud vase near front-right edge of nightstand -->
  <circle cx="214" cy="606" r="9" fill="#9d174d" stroke="#f9a8d4" stroke-width="1.5"/>

  <text x="236" y="570" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">NIGHTSTAND (95° LEFT)</text>
  <text x="236" y="696" fill="#fde68a" font-size="10" text-anchor="middle">RC-6025 · LAMP · ROSES</text>

  <!-- RIGHT LEGEND PANEL -->
  <rect x="780" y="120" width="290" height="610" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="802" y="154" fill="#f8fafc" font-size="15" font-weight="700">LOCKED SHOT CONTINUITY</text>
  <line x1="802" y1="168" x2="1048" y2="168" stroke="#334155" stroke-width="1.5"/>

  <!-- Shot 1 Card -->
  <rect x="800" y="186" width="250" height="150" rx="8" fill="#0c2238" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="814" y="210" fill="#7dd3fc" font-size="13" font-weight="700">SHOT 1 · WAKE UP (0°)</text>
  <text x="814" y="232" fill="#e2e8f0" font-size="11">• Pure 14mm POV straight ahead.</text>
  <text x="814" y="250" fill="#e2e8f0" font-size="11">• Sees: Quilt, own hands/legs,</text>
  <text x="814" y="266" fill="#e2e8f0" font-size="11">  3 frosted arched bay windows.</text>
  <text x="814" y="286" fill="#38bdf8" font-size="11" font-weight="700">• ALARM NOT IN FRAME!</text>
  <text x="814" y="304" fill="#94a3b8" font-size="11">• Audio ONLY: 6 AM radio blasts</text>
  <text x="814" y="320" fill="#94a3b8" font-size="11">  from off-screen LEFT.</text>

  <!-- Shot 2 Card -->
  <rect x="800" y="356" width="250" height="164" rx="8" fill="#2b1e08" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="814" y="380" fill="#fbbf24" font-size="13" font-weight="700">SHOT 2 · TURN LEFT (95°)</text>
  <text x="814" y="402" fill="#fef3c7" font-size="11">• Head pivots 90–95° LEFT on</text>
  <text x="814" y="418" fill="#fef3c7" font-size="11">  the pillow toward the sound.</text>
  <text x="814" y="438" fill="#fbbf24" font-size="11" font-weight="700">• REVEALS glowing '6 00' clock!</text>
  <text x="814" y="456" fill="#e2e8f0" font-size="11">• Phil's LEFT hand enters from</text>
  <text x="814" y="472" fill="#e2e8f0" font-size="11">  bottom-right to silence alarm.</text>
  <text x="814" y="492" fill="#94a3b8" font-size="11">• Right edge catches Bay Window #1</text>
  <text x="814" y="508" fill="#94a3b8" font-size="11">  + pink roses; lamp behind clock.</text>

  <!-- Shot 3 Card -->
  <rect x="800" y="540" width="250" height="168" rx="8" fill="#2a1024" stroke="#f472b6" stroke-width="1.5"/>
  <text x="814" y="564" fill="#f472b6" font-size="13" font-weight="700">SHOT 3 · DEPRESSION (3RD)</text>
  <text x="814" y="586" fill="#fce7f3" font-size="11">• Locked wide A24 frame from</text>
  <text x="814" y="602" fill="#fce7f3" font-size="11">  top-right looking diagonally back.</text>
  <text x="814" y="622" fill="#e2e8f0" font-size="11">• Exact 1993 film match:</text>
  <text x="814" y="638" fill="#e2e8f0" font-size="11">  Headboard behind Phil,</text>
  <text x="814" y="654" fill="#e2e8f0" font-size="11">  Nightstand on Phil's LEFT</text>
  <text x="814" y="670" fill="#e2e8f0" font-size="11">  (viewer's right in front shot),</text>
  <text x="814" y="686" fill="#e2e8f0" font-size="11">  Curtains drawn at 1:00 PM.</text>

  <!-- Footer -->
  <text x="44" y="795" fill="#64748b" font-size="11">180° CONTINUITY RULE: Matches 1993 Groundhog Day room layout — Nightstand/RC-6025 sits at 95° to Phil's LEFT, hidden on wake-up until he turns left.</text>
</svg>
