<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1440" height="900" fill="#090e16"/>

  <!-- Header -->
  <rect x="24" y="18" width="1392" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.2">S00 · PROLOGUE &amp; HEARTHSIDE BEDROOM WAKE-UP (00:00–00:14)</text>
  <text x="44" y="74" fill="#94a3b8" font-size="13">SYNCED TO ASTRA STORYBOARD (hotel-bedroom.svg · S00-A/B/C/D/E) · FIXED 14mm RECTILINEAR POV · NIGHTSTAND AT 95° TO PHIL'S RIGHT</text>
  <rect x="1215" y="34" width="182" height="38" rx="6" fill="#0c2238" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1306" y="58" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">LENS: FIXED 14mm POV</text>

  <!-- PANEL A: OVERHEAD BEDROOM FLOORPLAN (LEFT) -->
  <rect x="24" y="106" width="690" height="770" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="136" fill="#7dd3fc" font-size="14" font-weight="700">A. OVERHEAD BEDROOM FLOORPLAN (NORTH = PHIL'S FEET ↑)</text>

  <!-- Compass -->
  <g transform="translate(668,148)">
    <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="-13" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrCyan)"/>
    <text x="0" y="36" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">NORTH</text>
  </g>

  <!-- Room Polygon (Octagonal Bay North Wall) -->
  <polygon points="88,280 208,170 500,170 620,280 620,760 88,760" fill="#141f30" stroke="#64748b" stroke-width="4"/>
  <!-- Wainscoting dashed inner trim -->
  <polygon points="98,285 213,180 495,180 610,285 610,750 98,750" fill="none" stroke="#a16207" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- 3 Frosted Arched Bay Windows (North) -->
  <line x1="112" y1="258" x2="188" y2="188" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="108" y="200" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">BAY 1 (NW)</text>
  <text x="108" y="214" fill="#94a3b8" font-size="10" text-anchor="middle">Left arch</text>

  <line x1="274" y1="170" x2="434" y2="170" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="354" y="154" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">BAY 2 (NORTH CENTER)</text>

  <line x1="520" y1="188" x2="596" y2="258" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>
  <text x="606" y="200" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">BAY 3 (NE)</text>
  <text x="606" y="214" fill="#fbbf24" font-size="10" text-anchor="middle">Left edge in S00-E</text>

  <!-- West Hall Door (Phil's Left) -->
  <line x1="88" y1="540" x2="88" y2="635" stroke="#090e16" stroke-width="8"/>
  <line x1="88" y1="635" x2="168" y2="635" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M 88,545 A 80,80 0 0 1 168,635" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="58" y="592" fill="#94a3b8" font-size="11" text-anchor="middle" transform="rotate(-90 58 592)">WEST · HALL DOOR</text>

  <!-- Floor Lamp SW -->
  <circle cx="132" cy="708" r="16" fill="#334155" stroke="#d97706" stroke-width="2"/>
  <text x="132" y="712" fill="#fde68a" font-size="9" text-anchor="middle">LAMP</text>

  <!-- Rocking Chair NE -->
  <rect x="524" y="302" width="70" height="58" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="559" y="328" fill="#cbd5e1" font-size="10" text-anchor="middle">ROCKING</text>
  <text x="559" y="342" fill="#cbd5e1" font-size="10" text-anchor="middle">CHAIR</text>

  <!-- Small Framed Picture on East Wall (Matches S00-C/D) -->
  <rect x="615" y="405" width="9" height="44" fill="#d97706" stroke="#fde68a" stroke-width="1"/>
  <text x="598" y="431" fill="#fde68a" font-size="9" text-anchor="end">FRAMED PIC</text>

  <!-- S00-C / S00-D FOV CONE (0° STRAIGHT AHEAD — NO ALARM IN FRAME!) -->
  <path d="M 354,660 L 140,210 L 568,210 Z" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="354" y1="660" x2="354" y2="255" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>
  <rect x="278" y="294" width="152" height="24" rx="4" fill="#0c2238" stroke="#38bdf8" stroke-width="1"/>
  <text x="354" y="310" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">S00-C/D · 0° AHEAD</text>

  <!-- S00-E FOV CONE (95° TURN RIGHT — REVEALS CLOCK + BAY 3 LEFT!) -->
  <path d="M 354,660 L 560,248 L 605,748 Z" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="354" y1="660" x2="508" y2="672" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <rect x="486" y="540" width="114" height="22" rx="4" fill="#2b1e08" stroke="#fbbf24" stroke-width="1"/>
  <text x="543" y="555" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">S00-E · 95° RIGHT</text>

  <!-- S04-B2/C Reverse Wide Camera (NW Corner — Preview reference) -->
  <circle cx="144" cy="300" r="9" fill="#f472b6"/>
  <line x1="152" y1="308" x2="294" y2="498" stroke="#f472b6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrPink)"/>
  <text x="150" y="284" fill="#f472b6" font-size="10" font-weight="700">S04 NW CAM (28mm 3RD)</text>

  <!-- Double Bed + Mahogany Headboard (South) -->
  <rect x="234" y="732" width="240" height="22" rx="3" fill="#451a03" stroke="#b45309" stroke-width="2"/>
  <text x="354" y="782" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">SOUTH · DARK MAHOGANY EASTLAKE HEADBOARD (BEHIND PHIL'S HEAD)</text>

  <rect x="244" y="468" width="220" height="264" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="252" y="476" width="204" height="164" rx="5" fill="#312e81" fill-opacity="0.38" stroke="#f9a8d4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="354" y="544" fill="#f9a8d4" font-size="12" font-weight="700" text-anchor="middle">PATCHWORK QUILT</text>
  <text x="354" y="562" fill="#cbd5e1" font-size="11" text-anchor="middle">(Phil's legs pointing NORTH ↑)</text>
  <!-- Pillows -->
  <rect x="258" y="652" width="90" height="58" rx="8" fill="#4c1d3d" stroke="#f9a8d4" stroke-width="1.5"/>
  <rect x="360" y="652" width="90" height="58" rx="8" fill="#4c1d3d" stroke="#f9a8d4" stroke-width="1.5"/>

  <!-- Phil's Eyes / Pillow Pivot -->
  <circle cx="354" cy="660" r="16" fill="#090e16" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="354" cy="653" r="4" fill="#38bdf8"/>
  <text x="354" y="698" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">PHIL'S EYES (PIVOT ONLY — NO TRANSLATE)</text>

  <!-- Nightstand at 95° RIGHT (East) -->
  <circle cx="556" cy="672" r="56" fill="url(#clockGlow)"/>
  <rect x="510" y="622" width="92" height="94" rx="6" fill="#422006" stroke="#fbbf24" stroke-width="2.5"/>
  <rect x="518" y="630" width="76" height="78" rx="4" fill="none" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3 2" opacity="0.8"/>
  <!-- RC-6025 Clock facing Phil on Left -->
  <g transform="translate(534,672) rotate(-85)">
    <rect x="-22" y="-11" width="44" height="22" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <rect x="-16" y="-8" width="32" height="10" fill="#020617"/>
    <text x="0" y="0" fill="#fbbf24" font-size="8" font-weight="700" text-anchor="middle">6 00</text>
  </g>
  <!-- Brass Lamp behind clock (SE of stand) -->
  <circle cx="576" cy="692" r="12" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Pink Roses Bud Vase (NE of stand) -->
  <circle cx="574" cy="646" r="9" fill="#9d174d" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="556" y="610" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">NIGHTSTAND (95° RIGHT)</text>
  <text x="556" y="732" fill="#fde68a" font-size="10" text-anchor="middle">RC-6025 · LAMP · ROSES</text>

  <!-- Footer Note in Panel A -->
  <rect x="44" y="802" width="650" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="58" y="824" fill="#34d399" font-size="11" font-weight="700">PROLOGUE STREET (S00-A &amp; S00-B) SEE S05 MAIN STREET MAP:</text>
  <text x="58" y="841" fill="#cbd5e1" font-size="9.5">• S00-A (Mark W, POV NE): Gloved right index taps silver watch on left wrist; Rita cues 30s at weather tripod.</text>
  <text x="58" y="855" fill="#cbd5e1" font-size="9.5">• S00-B (Mark P, POV ENE): Walking east past brick pier &amp; Ned's open burgundy policy book (cuts to bed quilt).</text>

  <!-- PANEL B: 21:9 CAMERA-FRAME SPATIAL MAPS (TOP RIGHT) -->
  <rect x="734" y="106" width="682" height="444" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="136" fill="#fbbf24" font-size="14" font-weight="700">B. 21:9 CAMERA-FRAME SCREEN-LEFT / CENTER / SCREEN-RIGHT MAPS</text>

  <!-- Frame 1: S00-C / S00-D (0° Straight Ahead) -->
  <text x="754" y="164" fill="#7dd3fc" font-size="12" font-weight="700">SHOT S00-C (NIGHT) &amp; S00-D (COLD TUESDAY 6:00 AM) — 0° STRAIGHT AHEAD (14mm)</text>
  <rect x="754" y="174" width="642" height="152" rx="6" fill="#0b1320" stroke="#38bdf8" stroke-width="2"/>
  <!-- 3-column guides -->
  <line x1="968" y1="174" x2="968" y2="326" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1182" y1="174" x2="1182" y2="326" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Arched windows -->
  <path d="M 792,276 L 792,226 A 32,32 0 0 1 856,226 L 856,276 Z" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="824" y="210" fill="#bae6fd" font-size="10" text-anchor="middle">BAY 1 (L)</text>
  <path d="M 1034,272 L 1034,224 A 34,34 0 0 1 1102,224 L 1102,272 Z" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="1068" y="210" fill="#bae6fd" font-size="10" text-anchor="middle">BAY 2 (CENTER)</text>
  <path d="M 1222,276 L 1222,226 A 32,32 0 0 1 1286,226 L 1286,276 Z" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="1254" y="210" fill="#bae6fd" font-size="10" text-anchor="middle">BAY 3 (R)</text>
  <!-- Framed pic far right -->
  <rect x="1332" y="210" width="38" height="32" fill="#422006" stroke="#fde68a" stroke-width="1.2"/>
  <text x="1351" y="255" fill="#fde68a" font-size="9" text-anchor="middle">PIC</text>
  <!-- Quilt mound + 2 hands -->
  <path d="M 800,326 Q 1075,256 1350,326 Z" fill="#312e81" fill-opacity="0.7" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="1075" y="302" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">QUILT + TWO FORESHORTENED HANDS (NAVY PAJAMA SLEEVES)</text>
  <text x="1075" y="319" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">ZERO CLOCK IN FRAME · ZERO BARE CHEST SKIN (SAFE FOR SEEDANCE 2.5)</text>

  <!-- Frame 2: S00-E (95° Right Pivot) -->
  <text x="754" y="354" fill="#fbbf24" font-size="12" font-weight="700">SHOT S00-E (TUESDAY) &amp; S06-C2 (WEDNESDAY) — 95° RIGHT PIVOT (SAME FIXED 14mm)</text>
  <rect x="754" y="364" width="642" height="164" rx="6" fill="#0b1320" stroke="#fbbf24" stroke-width="2"/>
  <line x1="968" y1="364" x2="968" y2="528" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1182" y1="364" x2="1182" y2="528" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- Bay 3 far left -->
  <path d="M 760,486 L 760,418 A 34,34 0 0 1 826,418 L 826,486 Z" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="794" y="404" fill="#bae6fd" font-size="10" text-anchor="middle">BAY 3 EDGE</text>
  <!-- Ceiling corner top center -->
  <text x="1075" y="384" fill="#94a3b8" font-size="10" text-anchor="middle">CEILING + WALL CORNER VISIBLE (PROVES 14mm — NO ZOOM!)</text>
  <!-- Right forearm reaching from lower-left-center toward clock -->
  <path d="M 852,528 L 1068,452 L 1086,468 L 900,528 Z" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="972" y="510" fill="#bfdbfe" font-size="10" font-weight="700" text-anchor="middle">RIGHT ARM REACHING</text>
  <!-- Nightstand + RC-6025 + Lamp + Roses on right -->
  <rect x="1152" y="486" width="224" height="42" fill="#422006" stroke="#b45309" stroke-width="1.5"/>
  <!-- Lamp -->
  <polygon points="1244,394 1304,394 1318,448 1230,448" fill="#fef3c7" fill-opacity="0.85" stroke="#d97706" stroke-width="1.5"/>
  <line x1="1274" y1="448" x2="1274" y2="486" stroke="#d97706" stroke-width="4"/>
  <text x="1274" y="385" fill="#fde68a" font-size="9" text-anchor="middle">FULL SHADE</text>
  <!-- Clock -->
  <rect x="1164" y="458" width="84" height="32" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="1172" y="464" width="54" height="18" fill="#020617"/>
  <text x="1199" y="478" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">6 00</text>
  <!-- Pink roses -->
  <circle cx="1340" cy="466" r="14" fill="#9d174d" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="1340" y="446" fill="#f9a8d4" font-size="9" text-anchor="middle">ROSES</text>
  <text x="1264" y="514" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">SPLIT-FLAP RC-6025 (NO LCD!)</text>

  <!-- PANEL C: HARD CONTINUITY LOCKS & FORBIDDEN ERRORS (BOTTOM RIGHT) -->
  <rect x="734" y="566" width="682" height="310" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="596" fill="#f8fafc" font-size="14" font-weight="700">C. ASTRA PHOTO-GEN SPATIAL LOCKS &amp; FORBIDDEN ERRORS</text>
  <line x1="754" y1="608" x2="1396" y2="608" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Lock Box -->
  <rect x="754" y="622" width="312" height="236" rx="8" fill="#0a241d" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="646" fill="#34d399" font-size="12" font-weight="700">MUST PRESERVE (LOCKED)</text>
  <text x="770" y="670" fill="#e2e8f0" font-size="11">1. EXACT 3 frosted arched bays</text>
  <text x="770" y="686" fill="#94a3b8" font-size="10">   (match 10_pov_wakeup / S00-D).</text>
  <text x="770" y="708" fill="#e2e8f0" font-size="11">2. Fixed 14mm FOV across C→D→E:</text>
  <text x="770" y="724" fill="#94a3b8" font-size="10">   ceiling, wall corner &amp; full shade</text>
  <text x="770" y="738" fill="#94a3b8" font-size="10">   stay visible on 95° right pivot.</text>
  <text x="770" y="760" fill="#e2e8f0" font-size="11">3. Mechanical split-flap RC-6025:</text>
  <text x="770" y="776" fill="#94a3b8" font-size="10">   crisp white-on-black '6 00' digits,</text>
  <text x="770" y="790" fill="#94a3b8" font-size="10">   lace doily, brass lamp, pink roses.</text>
  <text x="770" y="812" fill="#e2e8f0" font-size="11">4. Dark navy buttoned pajama sleeves</text>
  <text x="770" y="828" fill="#94a3b8" font-size="10">   (blocks bare-chest NSFW flags).</text>
  <text x="770" y="846" fill="#34d399" font-size="10" font-weight="700">5. S00-C/D/S06-C1 share 100% geometry.</text>

  <!-- Forbidden Box -->
  <rect x="1084" y="622" width="312" height="236" rx="8" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1100" y="646" fill="#f87171" font-size="12" font-weight="700">FORBIDDEN ERRORS (FROM QA)</text>
  <text x="1100" y="670" fill="#fecaca" font-size="11">✗ NO Phil head, ear, hair or shoulder</text>
  <text x="1100" y="686" fill="#fca5a5" font-size="10">   in S00-E (killed S00-E-STUDY!).</text>
  <text x="1100" y="708" fill="#fecaca" font-size="11">✗ NO rectangular divided window sashes</text>
  <text x="1100" y="724" fill="#fca5a5" font-size="10">   (killed S00-D-STUDY — keep arches!).</text>
  <text x="1100" y="746" fill="#fecaca" font-size="11">✗ NO modern green/black LCD digits</text>
  <text x="1100" y="762" fill="#fca5a5" font-size="10">   (flagged in S00-E QA — split-flap!).</text>
  <text x="1100" y="784" fill="#fecaca" font-size="11">✗ NO zoom-in to 35mm/50mm on turn.</text>
  <text x="1100" y="806" fill="#fecaca" font-size="11">✗ NO alarm visible in 0° forward S00-D.</text>
  <text x="1100" y="828" fill="#fecaca" font-size="11">✗ NO bare chest sliver at bottom edge</text>
  <text x="1100" y="844" fill="#fca5a5" font-size="10">   (triggers Seedance 2.5 NSFW reject).</text>
</svg>
