<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <pattern id="stairsPat" width="12" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 0 H 12" stroke="#64748b" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#090e16"/>

  <!-- Header -->
  <rect x="24" y="18" width="1392" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.2">S03 · III. ANGER — HEARTHSIDE LOBBY CREW FARE THEFT (00:42–00:52)</text>
  <text x="44" y="74" fill="#94a3b8" font-size="13">SYNCED TO L-MASTER (hotel-lobby.svg · S03-A GOODBYE → S03-B ENVELOPE LIFT → S03-C BEDROOM COAT POCKET)</text>
  <rect x="1195" y="34" width="202" height="38" rx="6" fill="#2a1215" stroke="#f87171" stroke-width="1.5"/>
  <text x="1296" y="58" fill="#fca5a5" font-size="13" font-weight="700" text-anchor="middle">SIGHTLINE-BLIND THEFT</text>

  <!-- PANEL A: OVERHEAD HOTEL LOBBY PLAN (LEFT) -->
  <rect x="24" y="106" width="690" height="770" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="136" fill="#7dd3fc" font-size="14" font-weight="700">A. HEARTHSIDE HOTEL LOBBY OVERHEAD (L-MASTER · NORTH ↑)</text>

  <!-- Lobby Footprint -->
  <rect x="64" y="168" width="600" height="540" fill="#141f30" stroke="#64748b" stroke-width="4"/>

  <!-- NW Stairs Upstairs -->
  <rect x="86" y="188" width="152" height="134" fill="url(#stairsPat)" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="162" y="180" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">NW · STAIRS TO ROOMS</text>

  <!-- West Lounge Seats -->
  <rect x="84" y="408" width="106" height="48" rx="6" fill="#1e3a3a" stroke="#64748b" stroke-width="1.5"/>
  <rect x="84" y="498" width="106" height="48" rx="6" fill="#1e3a3a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="137" cy="477" r="15" fill="#422006" stroke="#b45309" stroke-width="1.5"/>
  <text x="137" y="568" fill="#94a3b8" font-size="10" text-anchor="middle">WEST LOUNGE</text>

  <!-- East Oak Reception Counter -->
  <rect x="506" y="218" width="96" height="296" rx="6" fill="#422006" stroke="#d97706" stroke-width="2.5"/>
  <text x="556" y="366" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(90 556 366)">EAST OAK RECEPTION COUNTER</text>
  <!-- Key Pigeonholes behind desk (NO MIRROR!) -->
  <rect x="634" y="232" width="18" height="130" fill="#334155" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="622" y="300" fill="#fde68a" font-size="10" text-anchor="middle" transform="rotate(90 622 300)">KEY SLOTS (NO MIRROR!)</text>

  <!-- Tan Crew Fares Envelope + Green Ledger -->
  <rect x="502" y="392" width="38" height="26" rx="2" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="508" y="397" width="26" height="15" rx="1" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="496" y="346" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">CREW FARES ENVELOPE</text>
  <text x="496" y="360" fill="#34d399" font-size="10" text-anchor="end">(ON GREEN LEDGER)</text>

  <!-- East Glazing -->
  <line x1="664" y1="538" x2="664" y2="646" stroke="#bae6fd" stroke-width="8"/>
  <text x="646" y="592" fill="#bae6fd" font-size="10" text-anchor="middle" transform="rotate(90 646 592)">EAST GLAZING</text>

  <!-- South Double Exterior Doors + Opaque Vestibule Return -->
  <line x1="316" y1="708" x2="412" y2="708" stroke="#090e16" stroke-width="8"/>
  <path d="M 316,708 L 316,652 A 56,56 0 0 1 364,708" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 412,708 L 412,652 A 56,56 0 0 0 364,708" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 414,708 L 414,664 L 466,664" fill="none" stroke="#f472b6" stroke-width="7"/>
  <text x="476" y="668" fill="#f472b6" font-size="11" font-weight="700">OPAQUE VESTIBULE WALL</text>
  <text x="364" y="734" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">SOUTH · DOUBLE EXTERIOR DOORS</text>

  <!-- S03-A FOV Cone (P3 glancing SW at departing crew over his own ticket) -->
  <path d="M 418,404 L 258,616 L 444,634 Z" fill="#38bdf8" fill-opacity="0.11" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="418" y1="404" x2="352" y2="564" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="292" y="514" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">S03-A · GLANCE SW</text>
  <text x="292" y="528" fill="#94a3b8" font-size="10" text-anchor="middle">"See you at the party."</text>

  <!-- S03-B FOV Cone (P3 turning EAST & DOWN at envelope!) -->
  <path d="M 418,404 L 516,348 L 516,464 Z" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="418" y1="404" x2="498" y2="404" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="454" y="318" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">S03-B · EAST DESK</text>

  <!-- Phil P3 -->
  <circle cx="418" cy="404" r="15" fill="#090e16" stroke="#38bdf8" stroke-width="3"/>
  <text x="418" y="408" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">P3</text>

  <!-- Rita R3 & Larry L3 FACING AWAY SOUTH toward doors (BLIND TO DESK!) -->
  <circle cx="318" cy="596" r="15" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
  <text x="318" y="600" fill="#ecfdf5" font-size="10" font-weight="700" text-anchor="middle">R3</text>
  <line x1="318" y1="611" x2="328" y2="664" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrMint)"/>

  <circle cx="390" cy="602" r="15" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="390" y="606" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">L3</text>
  <line x1="390" y1="617" x2="388" y2="664" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrMint)"/>

  <rect x="44" y="756" width="650" height="100" rx="8" fill="#1b141a" stroke="#f87171" stroke-width="1.5"/>
  <text x="60" y="782" fill="#fca5a5" font-size="12" font-weight="700">BAND VISIBILITY / WITNESS RULE (WHY THIS THEFT WORKS):</text>
  <text x="60" y="804" fill="#e2e8f0" font-size="11">• R3 (Rita) and L3 (Larry) have their BACKS TO PHIL facing the South exterior doors.</text>
  <text x="60" y="822" fill="#e2e8f0" font-size="10">• They HEAR Phil's goodbye audio, so they do not turn around; ZERO mirror behind the East desk.</text>
  <text x="60" y="840" fill="#fbbf24" font-size="11" font-weight="700">• Witness receipt = PHIL ONLY. Phil already holds his own separate coach ticket!</text>

  <!-- PANEL B: 21:9 CAMERA-FRAME MAPS (TOP RIGHT) -->
  <rect x="734" y="106" width="682" height="456" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="134" fill="#fbbf24" font-size="14" font-weight="700">B. 21:9 CAMERA-FRAME SCREEN-LEFT / CENTER / SCREEN-RIGHT MAPS</text>

  <!-- S03-A -->
  <text x="754" y="162" fill="#7dd3fc" font-size="12" font-weight="700">SHOT S03-A · GOODBYE TO UNAWARE CREW (14mm POV LOOKING SW)</text>
  <rect x="754" y="172" width="642" height="154" rx="6" fill="#0b1320" stroke="#38bdf8" stroke-width="2"/>
  <line x1="968" y1="172" x2="968" y2="326" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1182" y1="172" x2="1182" y2="326" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="762" y="246" width="180" height="72" fill="#422006" stroke="#d97706" stroke-width="1.5"/>
  <text x="852" y="276" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">EAST DESK EDGE (L)</text>
  <text x="852" y="294" fill="#fbbf24" font-size="9" text-anchor="middle">Tan envelope visible</text>
  <circle cx="1046" cy="232" r="22" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <text x="1046" y="236" fill="#ecfdf5" font-size="10" text-anchor="middle">RITA</text>
  <circle cx="1116" cy="232" r="22" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="1116" y="236" fill="#f8fafc" font-size="10" text-anchor="middle">LARRY</text>
  <text x="1080" y="274" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">BACKS TURNED AT SOUTH DOORS</text>
  <text x="1080" y="314" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">PHIL'S OWN COACH TICKET IN LOWER FOREGROUND HAND</text>
  <text x="1288" y="242" fill="#94a3b8" font-size="10" text-anchor="middle">LOUNGE / STAIRS</text>
  <text x="1288" y="258" fill="#94a3b8" font-size="10" text-anchor="middle">WEST DEPTH (R)</text>

  <!-- S03-B -->
  <text x="754" y="352" fill="#fbbf24" font-size="12" font-weight="700">SHOT S03-B · LIFTING THE CASH (14mm POV LOOKING EAST &amp; DOWN)</text>
  <rect x="754" y="362" width="642" height="180" rx="6" fill="#0b1320" stroke="#fbbf24" stroke-width="2"/>
  <!-- Upper background: brass key pigeonholes -->
  <rect x="774" y="372" width="602" height="44" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="1075" y="398" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">BRASS KEY PIGEONHOLES + OAK WALL BEHIND COUNTER (ZERO MIRROR!)</text>
  <!-- Desk surface + green ledger + tan envelope -->
  <rect x="774" y="424" width="602" height="110" fill="#422006" stroke="#b45309" stroke-width="1.5"/>
  <rect x="955" y="438" width="240" height="72" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="996" y="454" width="136" height="44" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <text x="1064" y="478" fill="#451a03" font-size="10" font-weight="700" text-anchor="middle">TAN ENVELOPE</text>
  <!-- Left gloved hand + watch pins envelope -->
  <rect x="858" y="476" width="142" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="929" y="494" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">L GLOVE + WATCH PINS</text>
  <!-- Right gloved hand pulls folded bills -->
  <rect x="1126" y="468" width="62" height="22" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
  <text x="1157" y="483" fill="#ecfdf5" font-size="9" font-weight="700" text-anchor="middle">US CASH</text>
  <rect x="1184" y="484" width="154" height="28" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="1261" y="502" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">R GLOVE DRAWS BILLS</text>
  <text x="1075" y="528" fill="#f9a8d4" font-size="9" text-anchor="middle">Charcoal coat sleeve &amp; oxblood scarf edge lower-right · S03-C matches cash fold into inner-left pocket</text>

  <!-- PANEL C: QA LOCKS & FORBIDDEN ERRORS (BOTTOM RIGHT) -->
  <rect x="734" y="578" width="682" height="298" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="606" fill="#f8fafc" font-size="14" font-weight="700">C. ASTRA PHOTO-GEN SPATIAL LOCKS &amp; FORBIDDEN ERRORS</text>
  <line x1="754" y1="618" x2="1396" y2="618" stroke="#1e293b" stroke-width="1.5"/>

  <rect x="754" y="632" width="312" height="226" rx="8" fill="#0a241d" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="656" fill="#34d399" font-size="12" font-weight="700">MUST PRESERVE (LOCKED)</text>
  <text x="770" y="680" fill="#e2e8f0" font-size="11">1. Lock to L-MASTER lobby geometry:</text>
  <text x="770" y="696" fill="#94a3b8" font-size="10">   East oak counter right, NW stairs</text>
  <text x="770" y="710" fill="#94a3b8" font-size="10">   left, opaque south vestibule return.</text>
  <text x="770" y="732" fill="#e2e8f0" font-size="11">2. Keep Phil's ticket &amp; crew cash</text>
  <text x="770" y="748" fill="#94a3b8" font-size="10">   visually distinct (S03-A vs S03-B).</text>
  <text x="770" y="770" fill="#e2e8f0" font-size="11">3. Dark gloves on BOTH hands + silver</text>
  <text x="770" y="786" fill="#94a3b8" font-size="10">   watch on LEFT wrist + oxblood scarf.</text>
  <text x="770" y="808" fill="#e2e8f0" font-size="11">4. Leave envelope label blank/clean</text>
  <text x="770" y="824" fill="#94a3b8" font-size="10">   (or clean 'CREW RETURN FARES' insert).</text>
  <text x="770" y="846" fill="#34d399" font-size="10" font-weight="700">5. S03-C matches folded bill crease.</text>

  <rect x="1084" y="632" width="312" height="226" rx="8" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1100" y="656" fill="#f87171" font-size="12" font-weight="700">FORBIDDEN ERRORS (FROM QA)</text>
  <text x="1100" y="680" fill="#fecaca" font-size="11">✗ NO missing crew in S03-A or stairs</text>
  <text x="1100" y="696" fill="#fca5a5" font-size="10">   facing camera (killed S03-B-study!).</text>
  <text x="1100" y="718" fill="#fecaca" font-size="11">✗ NO mirror behind reception desk</text>
  <text x="1100" y="734" fill="#fca5a5" font-size="10">   (would reveal Phil's face too early!).</text>
  <text x="1100" y="756" fill="#fecaca" font-size="11">✗ NO second envelope, extra third hand,</text>
  <text x="1100" y="772" fill="#fca5a5" font-size="10">   or hotel clerk watching behind desk.</text>
  <text x="1100" y="794" fill="#fecaca" font-size="11">✗ NO Rita/Larry looking toward desk</text>
  <text x="1100" y="810" fill="#fca5a5" font-size="10">   (must face South doors with backs).</text>
  <text x="1100" y="834" fill="#fecaca" font-size="11">✗ NO Phil face/shoulder in S03 POV.</text>
</svg>
