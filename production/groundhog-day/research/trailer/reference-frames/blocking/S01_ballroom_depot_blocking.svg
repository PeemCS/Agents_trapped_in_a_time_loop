<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#090e16"/>

  <!-- Header -->
  <rect x="24" y="18" width="1392" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.2">S01 · I. SPEEDRUN THE SCRIPT — BALLROOM PIANO → EMPTY DEPOT (00:14–00:28)</text>
  <text x="44" y="74" fill="#94a3b8" font-size="13">SYNCED TO BALL-M &amp; DEP-M (ballroom.svg · depot.svg · S01-B1/B2 → HARD WRIST MATCH CUT → S01-C1/D1)</text>
  <rect x="1205" y="34" width="192" height="38" rx="6" fill="#0c2238" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1301" y="58" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">MATCH CUT: 14mm POV</text>

  <!-- PANEL A1: BALLROOM OVERHEAD (TOP LEFT) -->
  <rect x="24" y="106" width="690" height="378" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="134" fill="#7dd3fc" font-size="14" font-weight="700">A1. HOTEL BALLROOM OVERHEAD (BALL-M · S01-B1/B2 · NORTH ↑)</text>

  <!-- Ballroom walls -->
  <rect x="64" y="164" width="560" height="270" fill="#141f30" stroke="#64748b" stroke-width="4"/>
  <!-- Parquet floor hint -->
  <text x="344" y="414" fill="#475569" font-size="11" text-anchor="middle">SCUFFED PARQUET FLOOR (NO CARPET!)</text>
  <!-- North frosted windows bracketing piano -->
  <line x1="120" y1="164" x2="215" y2="164" stroke="#bae6fd" stroke-width="9"/>
  <text x="168" y="154" fill="#bae6fd" font-size="10" text-anchor="middle">FROSTED WIN #1</text>
  <line x1="470" y1="164" x2="565" y2="164" stroke="#bae6fd" stroke-width="9"/>
  <text x="518" y="154" fill="#bae6fd" font-size="10" text-anchor="middle">FROSTED WIN #2</text>

  <!-- West Hall Entrance (frame-left) -->
  <line x1="64" y1="265" x2="64" y2="335" stroke="#090e16" stroke-width="8"/>
  <path d="M 64,265 A 68,68 0 0 1 132,333" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="108" y="354" fill="#94a3b8" font-size="10" text-anchor="middle">WEST PASSAGE</text>

  <!-- Walnut Upright Piano (North Center) -->
  <rect x="268" y="172" width="152" height="44" fill="#451a03" stroke="#d97706" stroke-width="2"/>
  <rect x="274" y="206" width="140" height="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="344" y="196" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">WALNUT UPRIGHT</text>

  <!-- Piano Bench + Bentwood Chair on Phil's left -->
  <rect x="304" y="246" width="80" height="22" rx="3" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
  <rect x="242" y="250" width="34" height="32" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="258" y="298" fill="#cbd5e1" font-size="9" text-anchor="middle">BENTWOOD CHAIR</text>

  <!-- Brass sconces East wall -->
  <rect x="614" y="220" width="10" height="20" fill="#fbbf24"/>
  <rect x="614" y="312" width="10" height="20" fill="#fbbf24"/>
  <text x="582" y="276" fill="#fde68a" font-size="10" text-anchor="middle">SCONCES</text>

  <!-- C1 FOV Cone (Seated 1.18m, looking North, pitched -27°) -->
  <path d="M 344,256 L 200,168 L 488,168 Z" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="344" y1="256" x2="344" y2="196" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>
  <circle cx="344" cy="256" r="13" fill="#090e16" stroke="#38bdf8" stroke-width="3"/>
  <text x="344" y="260" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">C1</text>
  <text x="344" y="316" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">C1 · PHIL POV (1.18m · PITCH -27°)</text>
  <text x="344" y="332" fill="#94a3b8" font-size="10" text-anchor="middle">Charcoal coat cuffs + silver watch on LEFT wrist</text>

  <!-- PANEL A2: TOWN DEPOT OVERHEAD (BOTTOM LEFT) -->
  <rect x="24" y="500" width="690" height="376" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="528" fill="#fbbf24" font-size="14" font-weight="700">A2. TOWN DEPOT OVERHEAD (DEP-M · S01-C1/D1 · NORTH ↑)</text>

  <rect x="64" y="562" width="560" height="248" fill="#141f30" stroke="#64748b" stroke-width="4"/>
  <text x="468" y="794" fill="#475569" font-size="10" text-anchor="middle">GREY TERRAZZO · EMPTY DEPOT</text>

  <!-- North Shelter Glass (AHEAD OF PHIL!) -->
  <line x1="120" y1="562" x2="255" y2="562" stroke="#bae6fd" stroke-width="9"/>
  <line x1="295" y1="562" x2="430" y2="562" stroke="#bae6fd" stroke-width="9"/>
  <text x="275" y="550" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">NORTH SHELTER GLASS (SNOWY EVENING — NEVER SOLID WALL!)</text>

  <!-- East Timetable & Platform Opening -->
  <rect x="498" y="574" width="96" height="22" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="546" y="589" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">TIMETABLE</text>
  <line x1="624" y1="646" x2="624" y2="718" stroke="#090e16" stroke-width="9"/>
  <text x="646" y="686" fill="#fbbf24" font-size="10" font-weight="700" transform="rotate(90 646 686)" text-anchor="middle">EAST EXIT</text>

  <!-- Slatted South Bench -->
  <rect x="110" y="766" width="210" height="28" rx="4" fill="#78350f" stroke="#d97706" stroke-width="2"/>
  <text x="215" y="832" fill="#cbd5e1" font-size="11" text-anchor="middle">SLATTED WOOD BENCH (SOUTH WALL)</text>

  <!-- Depot C1 FOV Cone -->
  <path d="M 215,764 L 96,568 L 478,568 Z" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="215" y1="764" x2="215" y2="620" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <circle cx="215" cy="764" r="13" fill="#090e16" stroke="#fbbf24" stroke-width="3"/>
  <text x="215" y="768" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">C1</text>
  <text x="215" y="672" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">S01-C1 (PITCH -34°)</text>
  <text x="215" y="688" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">→ S01-D1 (TILT UP +22°)</text>
  <text x="455" y="690" fill="#94a3b8" font-size="10" text-anchor="middle">Ballroom dance music is</text>
  <text x="455" y="704" fill="#94a3b8" font-size="10" text-anchor="middle">OFF-SCREEN AUDIO ONLY</text>

  <!-- PANEL B: 21:9 MATCH-CUT ALIGNMENT MAP (TOP RIGHT) -->
  <rect x="734" y="106" width="682" height="476" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="134" fill="#34d399" font-size="14" font-weight="700">B. 21:9 GRAPHIC MATCH-CUT ALIGNMENT (WRIST X/Y PIXEL LOCK)</text>

  <!-- Frame B2: Piano Final Chord -->
  <text x="754" y="160" fill="#7dd3fc" font-size="12" font-weight="700">1. S01-B1 → S01-B2 · UPRIGHT PIANO KEYS (CHARCOAL CUFFS + LEFT WATCH)</text>
  <rect x="754" y="170" width="642" height="126" rx="6" fill="#0b1320" stroke="#38bdf8" stroke-width="2"/>
  <!-- Two windows flanking piano -->
  <rect x="772" y="178" width="56" height="58" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1"/>
  <rect x="1322" y="178" width="56" height="58" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1"/>
  <!-- Piano keys -->
  <rect x="850" y="218" width="450" height="28" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="1075" y="206" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">SHEET MUSIC + WALNUT UPRIGHT CENTER</text>
  <!-- Left & Right wrist alignment markers -->
  <line x1="975" y1="240" x2="975" y2="564" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1175" y1="240" x2="1175" y2="564" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="975" cy="252" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="975" y="256" fill="#e2e8f0" font-size="9" font-weight="700" text-anchor="middle">L+W</text>
  <circle cx="1175" cy="252" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1175" y="256" fill="#e2e8f0" font-size="9" font-weight="700" text-anchor="middle">R</text>
  <text x="844" y="284" fill="#94a3b8" font-size="9">Bentwood chair edge L</text>
  <text x="1075" y="284" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">← EXACT WRIST CENTERS LOCKED TO S01-C1 →</text>

  <!-- Frame C1: Depot Hands on Knees -->
  <text x="754" y="320" fill="#fbbf24" font-size="12" font-weight="700">2. S01-C1 · HARD MATCH CUT TO HANDS ON KNEES (EMPTY DEPOT BENCH)</text>
  <rect x="754" y="330" width="642" height="114" rx="6" fill="#0b1320" stroke="#fbbf24" stroke-width="2"/>
  <rect x="772" y="338" width="210" height="32" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1"/>
  <text x="877" y="358" fill="#bae6fd" font-size="10" text-anchor="middle">NORTH SHELTER GLASS (TOP)</text>
  <rect x="1290" y="338" width="90" height="28" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1335" y="356" fill="#e2e8f0" font-size="9" text-anchor="middle">TIMETABLE (E)</text>
  <circle cx="975" cy="396" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="975" y="400" fill="#e2e8f0" font-size="9" font-weight="700" text-anchor="middle">L+W</text>
  <circle cx="1175" cy="396" r="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1175" y="400" fill="#e2e8f0" font-size="9" font-weight="700" text-anchor="middle">R</text>
  <text x="1075" y="432" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">DARK TROUSER KNEES · CHARCOAL CUFFS · SILVER WATCH ON LEFT WRIST</text>

  <!-- Frame D1: Raise Gaze to Empty Shelter -->
  <text x="754" y="466" fill="#34d399" font-size="12" font-weight="700">3. S01-D1 · RAISE GAZE +22° IN PLACE (EMPTY SNOWY SHELTER)</text>
  <rect x="754" y="476" width="642" height="90" rx="6" fill="#0b1320" stroke="#34d399" stroke-width="2"/>
  <rect x="780" y="486" width="380" height="46" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.2"/>
  <text x="970" y="514" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">EMPTY SNOWY NORTH SHELTER GLASS + CEILING STRIP</text>
  <rect x="1264" y="488" width="114" height="42" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1321" y="512" fill="#e2e8f0" font-size="9" text-anchor="middle">EAST TIMETABLE</text>
  <text x="1075" y="556" fill="#94a3b8" font-size="10" text-anchor="middle">Knees/hands stay low at very bottom margin · NO second bench · NO solid wall ahead</text>

  <!-- PANEL C: QA LOCKS & FORBIDDEN ERRORS (BOTTOM RIGHT) -->
  <rect x="734" y="598" width="682" height="278" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="626" fill="#f8fafc" font-size="14" font-weight="700">C. ASTRA PHOTO-GEN SPATIAL LOCKS &amp; FORBIDDEN ERRORS</text>
  <line x1="754" y1="638" x2="1396" y2="638" stroke="#1e293b" stroke-width="1.5"/>

  <rect x="754" y="652" width="312" height="206" rx="8" fill="#0a241d" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="676" fill="#34d399" font-size="12" font-weight="700">MUST PRESERVE (LOCKED)</text>
  <text x="770" y="700" fill="#e2e8f0" font-size="11">1. Build B1 from BALL-M master:</text>
  <text x="770" y="716" fill="#94a3b8" font-size="10">   worn parquet floor, bentwood chair,</text>
  <text x="770" y="730" fill="#94a3b8" font-size="10">   two north windows bracketing piano.</text>
  <text x="770" y="752" fill="#e2e8f0" font-size="11">2. Build C1/D1 from DEP-M master:</text>
  <text x="770" y="768" fill="#94a3b8" font-size="10">   north glass straight ahead, grey</text>
  <text x="770" y="782" fill="#94a3b8" font-size="10">   terrazzo, east timetable right.</text>
  <text x="770" y="804" fill="#e2e8f0" font-size="11">3. Charcoal wool coat cuffs + silver</text>
  <text x="770" y="820" fill="#94a3b8" font-size="10">   watch on LEFT wrist in B1/B2/C1.</text>
  <text x="770" y="842" fill="#34d399" font-size="10" font-weight="700">4. Keep hands bare on keys &amp; knees.</text>

  <rect x="1084" y="652" width="312" height="206" rx="8" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1100" y="676" fill="#f87171" font-size="12" font-weight="700">FORBIDDEN ERRORS (FROM QA)</text>
  <text x="1100" y="700" fill="#fecaca" font-size="11">✗ NO bare forearms, padded chair or</text>
  <text x="1100" y="716" fill="#fca5a5" font-size="10">   carpet in S01-B1 (killed 1st study!).</text>
  <text x="1100" y="738" fill="#fecaca" font-size="11">✗ NO solid wall or extra bench ahead</text>
  <text x="1100" y="754" fill="#fca5a5" font-size="10">   in S01-C1 (killed 1st study!).</text>
  <text x="1100" y="776" fill="#fecaca" font-size="11">✗ NO extra people in ballroom or depot.</text>
  <text x="1100" y="798" fill="#fecaca" font-size="11">✗ NO focal length change between B2</text>
  <text x="1100" y="814" fill="#fca5a5" font-size="10">   and C1 (both locked fixed 14mm).</text>
  <text x="1100" y="838" fill="#fecaca" font-size="11">✗ NO head/shoulder/reflection in POV.</text>
</svg>
