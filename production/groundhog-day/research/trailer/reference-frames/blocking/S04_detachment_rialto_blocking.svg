<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#090e16"/>

  <!-- Header -->
  <rect x="24" y="18" width="1392" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="48" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1.2">S04 · IV. DEPRESSION — 1ST→3RD CAMERA DETACHMENT &amp; RIALTO BOOTH (00:52–01:14)</text>
  <text x="44" y="74" fill="#94a3b8" font-size="13">SYNCED TO L-MASTER · hotel-bedroom.svg · hotel-to-rialto.svg · BOOTH-MASTER (S04-A → B1/B2 → C → D1 → D2)</text>
  <rect x="1172" y="34" width="225" height="38" rx="6" fill="#2a1024" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1284" y="58" fill="#f9a8d4" font-size="13" font-weight="700" text-anchor="middle">14mm POV → 28mm 3RD PERSON</text>

  <!-- PANEL A1: BEDROOM 1ST->3RD DETACHMENT (TOP LEFT) -->
  <rect x="24" y="106" width="690" height="404" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="134" fill="#f472b6" font-size="14" font-weight="700">A1. BEDROOM DETACHMENT (S04-B1 CURTAINS → S04-B2/C LOCKED 28mm NW)</text>

  <!-- Bedroom outline -->
  <polygon points="84,230 184,158 456,158 556,230 556,478 84,478" fill="#141f30" stroke="#64748b" stroke-width="4"/>
  <!-- Closed curtains on 3 bays -->
  <line x1="106" y1="214" x2="170" y2="168" stroke="#64748b" stroke-width="9"/>
  <line x1="244" y1="158" x2="396" y2="158" stroke="#64748b" stroke-width="9"/>
  <line x1="470" y1="168" x2="534" y2="214" stroke="#64748b" stroke-width="9"/>
  <path d="M 102,226 L 182,168 L 458,168 L 538,226" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="320" y="150" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">HEAVY CURTAINS DRAWN SHUT AT 1:00 PM (BAY 2)</text>

  <!-- S04-B1 POV Hands at Bay 2 -->
  <circle cx="320" cy="196" r="10" fill="#090e16" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="320" y="220" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle">B1: LAST 14mm POV</text>

  <!-- Phil's walk from Bay 2 back to bed fully dressed -->
  <path d="M 310,204 Q 230,226 218,308 Q 214,368 258,396" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrAmber)"/>
  <text x="208" y="346" fill="#fde68a" font-size="10" text-anchor="end">Phil crawls</text>
  <text x="208" y="360" fill="#fde68a" font-size="10" text-anchor="end">back to bed</text>

  <!-- Bed & South Headboard -->
  <rect x="234" y="454" width="172" height="16" fill="#451a03" stroke="#b45309" stroke-width="2"/>
  <rect x="242" y="316" width="156" height="138" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="392" fill="#f9a8d4" font-size="10" font-weight="700" text-anchor="middle">PHIL SMALL ON BED</text>
  <text x="320" y="408" fill="#cbd5e1" font-size="9" text-anchor="middle">(1ST FACE REVEAL!)</text>
  <text x="320" y="496" fill="#94a3b8" font-size="10" text-anchor="middle">SOUTH HEADBOARD · S04-C: SAME FRAME AT DUSK (TIES SHOE)</text>

  <!-- Nightstand on Phil's RIGHT (East) -> reads SCREEN-LEFT from NW Camera! -->
  <rect x="424" y="384" width="76" height="68" rx="5" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="462" y="416" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">NIGHTSTAND</text>
  <text x="462" y="430" fill="#f472b6" font-size="9" font-weight="700" text-anchor="middle">(FRAME-LEFT</text>
  <text x="462" y="442" fill="#f472b6" font-size="9" font-weight="700" text-anchor="middle">IN REVERSE!)</text>

  <!-- LOCKED NW CAMERA (28mm 3RD PERSON!) -->
  <path d="M 134,244 L 496,348 L 204,468 Z" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="134" y1="244" x2="314" y2="380" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrPink)"/>
  <circle cx="134" cy="244" r="12" fill="#701a45" stroke="#f472b6" stroke-width="3"/>
  <text x="134" y="248" fill="#fce7f3" font-size="9" font-weight="700" text-anchor="middle">NW</text>
  <text x="108" y="274" fill="#f9a8d4" font-size="10" font-weight="700">28mm LOCKED</text>

  <!-- Sightline reminder box -->
  <rect x="572" y="176" width="126" height="170" rx="6" fill="#181224" stroke="#f472b6" stroke-width="1"/>
  <text x="582" y="198" fill="#f9a8d4" font-size="10" font-weight="700">REVERSE LOGIC</text>
  <text x="582" y="218" fill="#cbd5e1" font-size="9">From NW looking</text>
  <text x="582" y="232" fill="#cbd5e1" font-size="9">SE toward South</text>
  <text x="582" y="246" fill="#cbd5e1" font-size="9">headboard:</text>
  <text x="582" y="268" fill="#fbbf24" font-size="9" font-weight="700">• East nightstand</text>
  <text x="582" y="282" fill="#fbbf24" font-size="9" font-weight="700">  = SCREEN-LEFT</text>
  <text x="582" y="302" fill="#7dd3fc" font-size="9">• Bed = CENTER</text>
  <text x="582" y="322" fill="#94a3b8" font-size="9">• West wall/door</text>
  <text x="582" y="336" fill="#94a3b8" font-size="9">  = SCREEN-RIGHT</text>

  <!-- PANEL A2: RIALTO PROJECTION BOOTH (BOTTOM LEFT) -->
  <rect x="24" y="524" width="690" height="352" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="552" fill="#fbbf24" font-size="14" font-weight="700">A2. RIALTO PROJECTION BOOTH (BOOTH-MASTER · S04-D2 · PHIL ABSENT!)</text>

  <rect x="64" y="578" width="590" height="252" fill="#1c2426" stroke="#94a3b8" stroke-width="4"/>
  <!-- Working window North-West (Picture Left!) -->
  <line x1="168" y1="578" x2="316" y2="578" stroke="#bae6fd" stroke-width="9"/>
  <text x="242" y="568" fill="#bae6fd" font-size="10" font-weight="700" text-anchor="middle">WORKING WINDOW TO ROOFS (FRAME-LEFT!)</text>
  <!-- Projector + North Worktop (Tape deck, cue sheet, task lamp) -->
  <rect x="132" y="612" width="120" height="58" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <text x="192" y="645" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle">35mm PROJECTOR</text>
  <rect x="314" y="612" width="248" height="58" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
  <text x="438" y="638" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">TAPE DECK · TASK LAMP · CUE SHEET</text>
  <text x="438" y="654" fill="#fbbf24" font-size="9" text-anchor="middle">(WARM PRACTICAL TUNGSTEN!)</text>
  <!-- Reel cabinet SE -->
  <rect x="492" y="754" width="132" height="52" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="558" y="784" fill="#cbd5e1" font-size="10" text-anchor="middle">REEL CABINET</text>
  <!-- SW Hall Door -->
  <line x1="138" y1="830" x2="218" y2="830" stroke="#090e16" stroke-width="8"/>
  <text x="178" y="848" fill="#94a3b8" font-size="10" text-anchor="middle">SW HALL DOOR</text>

  <!-- Larry & Rita at worktop (Autonomous off-screen world!) -->
  <circle cx="356" cy="708" r="15" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="356" y="712" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">L</text>
  <text x="356" y="738" fill="#cbd5e1" font-size="9" text-anchor="middle">Larry cues tape</text>
  <circle cx="496" cy="708" r="15" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
  <text x="496" y="712" fill="#ecfdf5" font-size="10" font-weight="700" text-anchor="middle">R</text>
  <text x="496" y="738" fill="#34d399" font-size="9" text-anchor="middle">Rita reaches</text>

  <!-- C1 Camera SW looking NE -->
  <path d="M 134,772 L 222,584 L 584,650 Z" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="134" y1="772" x2="386" y2="668" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrMint)"/>
  <circle cx="134" cy="772" r="12" fill="#090e16" stroke="#34d399" stroke-width="3"/>
  <text x="134" y="776" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">C1</text>
  <text x="134" y="802" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">SW SHOULDER-HT</text>

  <!-- PANEL B: 21:9 PROGRESSION STRIP (TOP RIGHT) -->
  <rect x="734" y="106" width="682" height="482" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="134" fill="#fbbf24" font-size="14" font-weight="700">B. 21:9 CAMERA-FRAME MAPS (POV DETACHMENT → ROOF BRIDGE → BOOTH)</text>

  <!-- S04-A Lobby Greeting -->
  <text x="754" y="160" fill="#7dd3fc" font-size="11" font-weight="700">1. S04-A · LAST LOBBY 14mm POV (AT NW STAIRS P4 LOOKING SE AT RITA)</text>
  <rect x="754" y="168" width="642" height="86" rx="6" fill="#0b1320" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="824" y="214" fill="#fde68a" font-size="10" text-anchor="middle">EAST DESK SLIVER (L)</text>
  <text x="1075" y="206" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">RITA WARMLY GREETS CAMERA (GREEN COAT + CLIPBOARD)</text>
  <text x="1075" y="224" fill="#94a3b8" font-size="10" text-anchor="middle">Points toward South doors at frame-right · Phil's gloved left hand low left</text>

  <!-- S04-B2 / S04-C Bedroom Locked 28mm Reverse Wide -->
  <text x="754" y="274" fill="#f472b6" font-size="11" font-weight="700">2. S04-B2 (1 PM BED) → S04-C (DUSK SHOELACE) — LOCKED 28mm NW 3RD PERSON</text>
  <rect x="754" y="282" width="642" height="96" rx="6" fill="#17101e" stroke="#f472b6" stroke-width="2"/>
  <rect x="774" y="316" width="110" height="50" fill="#422006" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="829" y="344" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">NIGHTSTAND (L)</text>
  <rect x="934" y="306" width="268" height="62" rx="4" fill="#1e293b" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="1068" y="332" fill="#fce7f3" font-size="11" font-weight="700" text-anchor="middle">DOUBLE BED + HEADBOARD · PHIL SMALL</text>
  <text x="1068" y="350" fill="#cbd5e1" font-size="10" text-anchor="middle">B2: fully dressed in bed | C: sits on edge tying shoe</text>
  <text x="1310" y="338" fill="#94a3b8" font-size="10" text-anchor="middle">WEST WALL /</text>
  <text x="1310" y="354" fill="#94a3b8" font-size="10" text-anchor="middle">HALL DOOR (R)</text>

  <!-- S04-D1 Roofline Bridge -->
  <text x="754" y="398" fill="#fbbf24" font-size="11" font-weight="700">3. S04-D1 · EXTERIOR ROOFLINE BRIDGE (DARK HOTEL LEFT → LIT RIALTO RIGHT)</text>
  <rect x="754" y="406" width="642" height="72" rx="6" fill="#0b1320" stroke="#fbbf24" stroke-width="1.8"/>
  <rect x="768" y="418" width="184" height="50" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="446" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">DARK HOTEL BAY (L)</text>
  <text x="1075" y="446" fill="#94a3b8" font-size="10" text-anchor="middle">← SNOWY STREET GAP (1 BLOCK) →</text>
  <rect x="1220" y="424" width="160" height="44" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1276" y="434" width="52" height="22" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5"/>
  <text x="1302" y="420" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">LIT RIALTO (R)</text>

  <!-- S04-D2 Rialto Booth -->
  <text x="754" y="498" fill="#34d399" font-size="11" font-weight="700">4. S04-D2 · RIALTO BOOTH (C1 SW→NE · WARM TUNGSTEN · PHIL ABSENT)</text>
  <rect x="754" y="506" width="642" height="72" rx="6" fill="#161d1c" stroke="#34d399" stroke-width="1.8"/>
  <rect x="768" y="516" width="110" height="50" fill="#1e3a5f" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="823" y="544" fill="#bae6fd" font-size="9" font-weight="700" text-anchor="middle">WINDOW (L)</text>
  <text x="955" y="544" fill="#cbd5e1" font-size="10" text-anchor="middle">PROJECTOR</text>
  <text x="1156" y="538" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">LARRY HANDS CASSETTE → RITA AT LAMP</text>
  <text x="1156" y="556" fill="#94a3b8" font-size="9" text-anchor="middle">Cue sheet &amp; analog tape deck · NO modern screens · NO on-air light</text>

  <!-- PANEL C: LOCKS & FORBIDDEN ERRORS (BOTTOM RIGHT) -->
  <rect x="734" y="604" width="682" height="272" rx="10" fill="#0d1522" stroke="#1e293b" stroke-width="1.5"/>
  <text x="754" y="632" fill="#f8fafc" font-size="14" font-weight="700">C. ASTRA PHOTO-GEN SPATIAL LOCKS &amp; FORBIDDEN ERRORS</text>
  <line x1="754" y1="644" x2="1396" y2="644" stroke="#1e293b" stroke-width="1.5"/>

  <rect x="754" y="658" width="312" height="200" rx="8" fill="#0a241d" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="682" fill="#34d399" font-size="12" font-weight="700">MUST PRESERVE (LOCKED)</text>
  <text x="770" y="704" fill="#e2e8f0" font-size="11">1. S04-B2 &amp; S04-C MUST share the</text>
  <text x="770" y="720" fill="#94a3b8" font-size="10">   EXACT locked 28mm NW camera mark</text>
  <text x="770" y="734" fill="#94a3b8" font-size="10">   (only daylight→dusk &amp; Phil move).</text>
  <text x="770" y="756" fill="#e2e8f0" font-size="11">2. Reverse handedness: East nightstand</text>
  <text x="770" y="772" fill="#94a3b8" font-size="10">   reads SCREEN-LEFT in NW 3rd-person.</text>
  <text x="770" y="794" fill="#e2e8f0" font-size="11">3. S04-D2 locks to BOOTH-MASTER:</text>
  <text x="770" y="810" fill="#94a3b8" font-size="10">   cold roof window L, warm lamp R.</text>
  <text x="770" y="834" fill="#34d399" font-size="10" font-weight="700">4. PHIL ABSENT in D1/D2 (Band mesh!).</text>

  <rect x="1084" y="658" width="312" height="200" rx="8" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1100" y="682" fill="#f87171" font-size="12" font-weight="700">FORBIDDEN ERRORS</text>
  <text x="1100" y="704" fill="#fecaca" font-size="11">✗ NO camera drift between B2 &amp; C</text>
  <text x="1100" y="720" fill="#fca5a5" font-size="10">   (time passage relies on locked frame).</text>
  <text x="1100" y="742" fill="#fecaca" font-size="11">✗ NO flipping nightstand to right side</text>
  <text x="1100" y="758" fill="#fca5a5" font-size="10">   in reverse NW shot (breaks S00-E).</text>
  <text x="1100" y="780" fill="#fecaca" font-size="11">✗ NO on-air broadcast light or switcher</text>
  <text x="1100" y="796" fill="#fca5a5" font-size="10">   in Rialto booth (save for S06-A!).</text>
  <text x="1100" y="818" fill="#fecaca" font-size="11">✗ NO modern LCD monitors or smartphones.</text>
  <text x="1100" y="840" fill="#fecaca" font-size="11">✗ NO Phil peeking in S04-D2.</text>
</svg>
