<title id="t">Where the story leaves evidence</title><desc id="d">Three demonstrated components: an actor commits an action, the town records an event with witnesses, and Bruin processes recorded decisions into a verifiable sequence. A dotted arrow to an explicitly proposed Ned-to-Rita receipt distinguishes the next performance.</desc>
