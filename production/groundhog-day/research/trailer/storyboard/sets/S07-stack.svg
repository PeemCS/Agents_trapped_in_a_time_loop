<text x="80" y="199" class="t">Actor</text><text x="80" y="242" class="s">Chooses from actions</text><text x="80" y="272" class="s">available in the room.</text>
<text x="490" y="199" class="t">Town ledger</text><text x="490" y="242" class="s">Records what happened</text><text x="490" y="272" class="s">and who witnessed it.</text>
<text x="906" y="199" class="t">Bruin / DuckDB</text><text x="906" y="242" class="s">Checks the order</text><text x="906" y="272" class="s">of recorded events.</text>
