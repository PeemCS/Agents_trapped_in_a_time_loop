<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img" aria-labelledby="t d">
  <title id="t">Hotel lobby, director's overhead blocking plan</title>
  <desc id="d">Top is north. Stairs northwest, two seats west, vestibule south and a long reception desk east. Phil takes cash at the east desk while Rita and Larry face the exterior doors, then comes down the stairs on the next Tuesday to greet Rita. Ned and Rita talk by the vestibule after Phil exits in scene five.</desc>
  <defs>
    <marker id="eye" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#72d5ee"/></marker>
    <marker id="actor" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#efad71"/></marker>
    <pattern id="stairs" width="12" height="15" patternUnits="userSpaceOnUse"><path d="M0 0H110" stroke="#849394" stroke-width="3"/></pattern>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#f2ede1}.h{font-size:31px;font-weight:700}.s{font-size:15px;fill:#bbc4c2}.label{font-size:15px;font-weight:700}.tiny{font-size:13px}.rule{stroke:#384b52;stroke-width:1.2}.wall{fill:none;stroke:#a7b2b2;stroke-width:6}.fov{fill:#72d5ee;fill-opacity:.1;stroke:#72d5ee;stroke-width:1.7;stroke-dasharray:5 5}.axis{stroke:#72d5ee;stroke-width:2;marker-end:url(#eye)}.walk{fill:none;stroke:#efad71;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#actor)}.p{fill:#11252a;stroke:#72d5ee;stroke-width:3}.r{fill:#406751;stroke:#abcbb4;stroke-width:2}.l{fill:#53616c;stroke:#a6b8c6;stroke-width:2}.n{fill:#876c43;stroke:#e8b782;stroke-width:2}</style>
  </defs>
  <rect width="1040" height="740" fill="#101a20"/>
  <text x="34" y="47" class="h">Hotel lobby</text><text x="34" y="73" class="s">Ground floor · overhead · circa 1993 · blocking for the fare theft, morning greeting and Ned’s return</text>
  <rect x="36" y="100" width="638" height="545" fill="#18272c"/>
  <path class="wall" d="M327 643H40V104H670V643H417"/>
  <path d="M327 643v-57m0 0q54 0 54 54m36 3v-57m0 0q-36 0-36 54" fill="none" stroke="#96a9ab" stroke-width="2"/>
  <path d="M418 641v-37h40" stroke="#bac3bc" fill="none" stroke-width="6"/>
  <text x="471" y="623" class="tiny">opaque vestibule return</text>
  <text x="372" y="672" class="label" text-anchor="middle">SOUTH · double exterior doors</text>
  <path d="M75 275V139h157v136z" fill="url(#stairs)" stroke="#9ea69f" stroke-width="3"/>
  <text x="83" y="128" class="label">NW · upstairs to rooms</text>
  <rect x="63" y="378" width="116" height="50" rx="5" fill="#40554d"/><rect x="63" y="470" width="116" height="50" rx="5" fill="#40554d"/><circle cx="115" cy="449" r="15" fill="#77614a"/>
  <text x="65" y="545" class="tiny">W · lounge seats</text>
  <rect x="521" y="166" width="94" height="300" rx="7" fill="#76533a" stroke="#d7aa7f" stroke-width="3"/>
  <path d="M585 181v272" stroke="#3d332d" stroke-width="3"/><text x="562" y="282" class="label" text-anchor="middle" transform="rotate(90 562 282)">E · oak reception counter</text>
  <rect x="521" y="348" width="27" height="13" rx="1" fill="#e9d5a6"/><text x="500" y="322" class="tiny" text-anchor="end">Envelope</text><path d="M501 324l31 24" stroke="#e9d5a6"/>
  <rect x="646" y="177" width="12" height="101" fill="#828d81"/><text x="623" y="370" transform="rotate(90 623 370)" class="tiny">key pigeonholes</text>
  <path d="M669 488v100" stroke="#aad2df" stroke-width="8"/><text x="647" y="604" class="tiny" text-anchor="end">east glazing</text>
  <path class="fov" d="M423 355l96-61v124z"/><line class="axis" x1="423" y1="355" x2="514" y2="355"/>
  <circle class="p" cx="423" cy="355" r="13"/><text x="415" y="360" class="tiny">P3</text>
  <path class="fov" d="M219 287l197 52-116 84z"/><line class="axis" x1="219" y1="287" x2="339" y2="363"/>
  <circle class="p" cx="219" cy="287" r="13"/><text x="211" y="292" class="tiny">P4</text>
  <circle class="r" cx="354" cy="383" r="15"/><text x="345" y="388" class="tiny">R4</text>
  <circle class="r" cx="324" cy="544" r="15"/><text x="315" y="549" class="tiny">R3</text><circle class="l" cx="395" cy="550" r="15"/><text x="387" y="555" class="tiny">L3</text>
  <line class="walk" x1="324" y1="561" x2="337" y2="607"/><line class="walk" x1="395" y1="567" x2="393" y2="607"/>
  <path class="walk" d="M412 376 Q367 408 287 379 Q242 359 225 316"/>
  <text x="272" y="432" class="tiny" fill="#efad71">Phil turns back upstairs</text>
  <circle class="n" cx="278" cy="576" r="15"/><text x="269" y="581" class="tiny">N5</text><circle class="r" cx="229" cy="556" r="15"/><text x="220" y="561" class="tiny">R5</text>
  <path d="M366 631Q335 617 289 582Q302 530 490 473" fill="none" stroke="#cfaaed" stroke-width="2.5" stroke-dasharray="3 5"/>
  <path d="m484 471 10 0-5 8" fill="none" stroke="#cfaaed" stroke-width="2.5"/>
  <text x="330" y="500" class="tiny">S05 camera to east desk</text>
  <path d="M627 133v-21m0 0-5 9m5-9 5 9" stroke="#d3dbd0" stroke-width="2" fill="none"/><text x="642" y="130" class="tiny">N</text>
  <line x1="696" y1="102" x2="696" y2="646" class="rule"/>
  <text x="720" y="129" class="label">Set lock</text><text x="720" y="157" class="s">South doors face the street.</text><text x="720" y="180" class="s">Northwest stairs lead to the bedroom.</text><text x="720" y="203" class="s">The ledger stays on the east desk.</text>
  <text x="720" y="252" class="label">03 · Fare envelope</text><text x="720" y="279" class="s">P3 faces east in first person.</text><text x="720" y="302" class="s">R3 and L3 face the doors while</text><text x="720" y="325" class="s">Phil lifts the cash. They hear him.</text><text x="720" y="348" class="s">Keep mirrors behind the desk out.</text>
  <text x="720" y="397" class="label">04 · Next morning</text><text x="720" y="424" class="s">At P4 the camera is Phil’s eyes.</text><text x="720" y="447" class="s">R4 faces the foot of the stairs.</text><text x="720" y="470" class="s">A friendly greeting feels familiar</text><text x="720" y="493" class="s">to Phil, ordinary to Rita.</text>
  <text x="720" y="542" class="label">05 · Carbon copy</text><text x="720" y="569" class="s">N5 and R5 meet west of the doors.</text><text x="720" y="592" class="s">Follow both to the near end of the east desk.</text><text x="720" y="615" class="s">Switcher: regional station. Tape: Rialto.</text>
  <text x="36" y="711" class="tiny" fill="#adb9b5">Cyan cone = camera sightline · orange trail = movement · numbers identify scenes · actor marks occur at different times</text>
</svg>
