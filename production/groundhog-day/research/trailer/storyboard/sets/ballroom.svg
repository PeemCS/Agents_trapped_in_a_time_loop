</g><text x="320" y="443" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#48606a" text-anchor="start">townspeople on parquet · evening only</text><line x1="759" y1="223" x2="759" y2="192" stroke="#17242c" stroke-width="2" stroke-dasharray="none" marker-end="url(#compass)"/><text x="759" y="184" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17242c" text-anchor="middle">N</text>
<line x1="811" y1="148" x2="811" y2="526" stroke="#c4c9c0" stroke-width="1" stroke-dasharray="none"/>
<text x="840" y="166" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#136e90" text-anchor="start">CAMERA AND BLOCKING</text>
<text x="840" y="200" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C1 · Phil at the keys</text>
<text x="840" y="222" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Seated POV, looking north, tipped down.</text>
<text x="840" y="241" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Two tall windows bracket the upright.</text>
<text x="840" y="260" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">West passage falls to frame-left.</text>
<text x="840" y="294" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C2 · S06 reserved reverse angle</text>
<text x="840" y="316" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">From the southeast toward the bench.</text>
<text x="840" y="335" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Rita enters from the west and takes the</text>
<text x="840" y="354" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">chair on Phil’s left. Keep her screen-left.</text>
<text x="840" y="388" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Recurring landmarks</text>
<text x="840" y="410" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Scuffed treble cheek on the upright,</text>
<text x="840" y="429" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">brass east-wall lights, parquet border.</text>
<line x1="38" y1="545" x2="1142" y2="545" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
<text x="40" y="572" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#48606a" text-anchor="start">PLAN KEY</text>
<circle cx="144" cy="568" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="144" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C</text>
<text x="165" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">camera / eyes</text>
<circle cx="323" cy="568" r="13" fill="#28735e" stroke="#faf8f1" stroke-width="2"/><text x="323" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">R</text>
<text x="344" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">actor / travel</text>
<line x1="489" y1="568" x2="531" y2="568" stroke="#a14f43" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#route)"/>
<text x="545" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">movement</text>
<text x="40" y="606" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Ochre pairs mark the evening dance. Keep the west approach clear for Rita. The afternoon piano rehearsal uses the same room.</text>
</svg>
