><circle cx="412" cy="259" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="412" y="263" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C1</text><circle cx="332" cy="269" r="13" fill="#28735e" stroke="#faf8f1" stroke-width="2"/><text x="332" y="273" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">R</text><path d="M91 341 L218 341 Q260 341 285 308 L319 281" stroke="#28735e" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#person)"/><text x="138" y="389" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#17242c" text-anchor="start">West hall / Rita’s entrance</text><text x="209" y="157" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#48606a" text-anchor="start">frosted glass</text><rect x="674" y="247" width="18" height="18" rx="0" fill="#dcb75f" stroke="#b07318" stroke-width="2"/><rect x="674" y="342" width="18" height="18" rx="0" fill="#dcb75f" stroke="#b07318" stroke-width="2"/><text x="640" y="233" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#48606a" text-anchor="start">sconces</text><g id="s06-evening-dancers" fill="#b87547" stroke="#faf8f1" stroke-width="1.5">
<title>Evening town dance. Each pair marks a couple. The western entrance and Rita's path to the piano stay clear.</title>
<defs><g id="dance-pair"><ellipse cx="-6" cy="0" rx="5" ry="7"/><ellipse cx="6" cy="0" rx="5" ry="7"/></g></defs>
