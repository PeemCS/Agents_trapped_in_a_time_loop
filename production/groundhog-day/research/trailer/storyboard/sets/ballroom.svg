<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img"><title>Hotel ballroom</title><desc>Plan north is the piano wall. Approximate playable area: 11 × 6 m.</desc><defs><marker id="camera" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#136e90"/></marker><marker id="person" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28735e"/></marker><marker id="route" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a14f43"/></marker><marker id="compass" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17242c"/></marker></defs>
