<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640" role="img" aria-labelledby="t d">
  <title id="t">Stage and screen capture layout for the live demonstration</title>
  <desc id="d">North wall holds a single display. Presenter stands west of screen and faces the audience on the south. Operator is east, clear of the presenter's camera. A separate digital route carries native browser and source views directly to program. The camera never films a projected screen for evidence.</desc>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#79cedc"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f2eae0}.h{font-size:30px;font-weight:700}.s{font-size:15px;fill:#bbcac7}.l{font-size:16px;font-weight:700}.sm{font-size:13px}</style></defs>
  <rect width="1050" height="640" fill="#101c23"/><text x="32" y="48" class="h">Live proof / presenter and screen</text>
  <text x="32" y="77" class="s">S07 · proposed physical staging · overlay and browser sources stay legible in a direct digital feed</text>
  <rect x="35" y="108" width="630" height="405" rx="8" fill="#222f36" stroke="#7b8d92" stroke-width="3"/>
  <rect x="224" y="128" width="314" height="12" rx="3" fill="#a8c5cd"/><text x="380" y="164" class="l" text-anchor="middle">NORTH · display</text>
  <rect x="166" y="216" width="349" height="99" fill="#34423f" stroke="#8da99f"/><text x="407" y="301" class="sm">stage edge</text>
  <circle cx="212" cy="252" r="17" fill="#c18b6d"/><text x="169" y="207" class="l">Presenter</text><path d="m212 269 23 38" stroke="#d7ba9f" stroke-width="2"/>
  <rect x="551" y="224" width="71" height="45" rx="3" fill="#405269" stroke="#b5c6d3"/><text x="572" y="252" class="sm">OP</text><text x="532" y="298" class="sm">Operator · east</text>
  <g fill="#43545b"><rect x="94" y="370" width="97" height="15" rx="5"/><rect x="238" y="370" width="97" height="15" rx="5"/><rect x="382" y="370" width="97" height="15" rx="5"/><rect x="526" y="370" width="97" height="15" rx="5"/><rect x="94" y="407" width="97" height="15" rx="5"/><rect x="238" y="407" width="97" height="15" rx="5"/><rect x="382" y="407" width="97" height="15" rx="5"/><rect x="526" y="407" width="97" height="15" rx="5"/></g>
  <path d="m271 486 18-25 18 25z" fill="#7ac9dc"/><path d="M288 460 216 272" stroke="#7ac9dc" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="315" y="480" class="sm">Camera · south aisle</text>
  <text x="699" y="136" class="l">Picture sources</text>
  <text x="699" y="169" class="s">1. Replay and actor monitor</text><text x="716" y="191" class="sm">Direct browser capture, readable labels.</text>
  <text x="699" y="239" class="s">2. Run receipt and switchboard</text><text x="716" y="261" class="sm">Real controls, real source identifiers.</text>
  <text x="699" y="310" class="s">3. Architecture diagram</text><text x="716" y="332" class="sm">Draw in edit; label staged features.</text>
  <text x="699" y="380" class="s">4. Optional presenter portrait</text><text x="716" y="402" class="sm">Single close mic. Light from west.</text><text x="716" y="424" class="sm">Use a real presenter or stay on evidence.</text>
  <text x="699" y="477" class="s">Cut back to the native feed for every</text><text x="699" y="500" class="s">number, source row and choice.</text>
  <path d="M49 557H998" stroke="#496169"/><text x="36" y="592" class="l">Program frame</text><text x="165" y="592" class="s">21:9 letterbox around the source. Enlarge single evidence regions at native resolution in edit.</text>
</svg>
