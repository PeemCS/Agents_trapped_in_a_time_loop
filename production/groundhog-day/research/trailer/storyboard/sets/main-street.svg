  <rect x="70" y="139" width="310" height="103" class="wall"/>
  <text x="86" y="169" class="head">Weather position</text>
  <text x="86" y="193" class="small">Cream enamel board · dark iron lamp</text>
  <text x="86" y="216" class="tiny dim">Crew working here on first Tuesday</text>
