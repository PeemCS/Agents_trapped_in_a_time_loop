  <g><path d="M604 500l-8 18h16z" class="camera"/><text x="621" y="520" class="tiny">X · waiting master</text><path d="M603 492l-9-153" class="cameraSight"/></g>
  <g><path d="M692 392l-8 18h16z" class="camera"/><text x="576" y="431" class="tiny">I · signature insert</text><path d="M688 391l-58-66" class="cameraSight"/></g>
  <path d="M695 412 C671 440 633 462 603 477 C684 480 753 455 791 428 S958 353 1003 250" class="cameraSight" opacity=".76"/><rect x="843" y="460" width="319" height="26" rx="4" fill="#0c151e"/><text x="854" y="478" class="small ice">D1 pull back → D2 track east → D3 jamb</text>
  <path d="M375 579h491" stroke="#7d929f" stroke-width="2"/>
  <text x="392" y="570" class="small">South field of view · looking north · east reads screen-right</text>
  <text x="70" y="570" class="tiny">SOUTH SIDEWALK</text>
  <rect x="40" y="638" width="399" height="198" rx="8" class="frame"/>
  <text x="60" y="668" class="head ice">Camera positions</text>
  <text x="60" y="698" class="small">W and P are Phil’s eye-height 14 mm.</text>
  <text x="60" y="722" class="small">T looks SE from behind the curbside rear tire.</text>
  <text x="60" y="746" class="small">X sees the pier and wagon in one frame.</text>
  <text x="60" y="770" class="small">I pulls back toward X, then tracks east with Ned.</text>
  <text x="60" y="803" class="tiny dim">At the jamb, match the dark wood and the doorbell.</text>
  <rect x="455" y="638" width="409" height="198" rx="8" class="frame"/>
  <text x="475" y="668" class="head gold">Ned’s round trip</text>
  <text x="475" y="698" class="small">Solid amber · from book to pen, heading east.</text>
  <text x="475" y="722" class="small">Dashed amber · back west to the waiting Phil.</text>
  <text x="475" y="746" class="small">Dotted amber · after sale, east to hotel.</text>
  <text x="475" y="770" class="small">Phil leaves west; the camera travels east with Ned.</text>
  <text x="475" y="803" class="tiny dim">Keep the stop beside the same brick pier in S00 and S05.</text>
  <rect x="880" y="638" width="420" height="198" rx="8" class="frame"/>
  <text x="900" y="668" class="head mint">Who sees what</text>
  <text x="900" y="698" class="small">S00 · Rita has the weather mark. Ned is east.</text>
  <text x="900" y="722" class="small">S05 · Rita works inside past the opaque return.</text>
  <text x="900" y="746" class="small">Only the buyer and seller witness the signature.</text>
  <text x="900" y="770" class="small">Phil is gone when Ned shows Rita the copy.</text>
  <text x="900" y="803" class="tiny dim">Lobby coverage continues across the south entry.</text>
  <text x="42" y="861" class="tiny dim">Fictional 1993 Punxsutawney · architecture continuity drawing · positions diagrammatic, not to scale</text>
</svg>
