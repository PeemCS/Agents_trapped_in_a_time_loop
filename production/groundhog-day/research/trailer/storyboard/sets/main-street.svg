<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="880" viewBox="0 0 1340 880" role="img" aria-labelledby="title desc">
  <title id="title">Main Street, the weather shoot and the policy sale</title>
  <desc id="desc">Overhead staging map for S00 and S05. The street runs west to east. The pitch and wait are filmed from south of the action. The isolated wheel insert looks southeast from the same curb. The west tire turnout, central shop pier, Ned's separate parked car and recessed hotel door appear left to right. Rita is behind an opaque vestibule wall during the sale.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#77d8f7"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ffbd73"/></marker>
    <marker id="mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9de1b8"/></marker>
    <pattern id="slush" width="62" height="54" patternUnits="userSpaceOnUse"><rect width="62" height="54" fill="#1e2d3a"/><path d="M2 15h16m25 18h9" stroke="#354655" stroke-width="1.2"/></pattern>
    <style>
      text{font-family:Helvetica,Arial,sans-serif;fill:#e9eff5} .title{font-size:33px;font-weight:700}.sub{font-size:16px;fill:#b8c9d8}.head{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px}.dim{fill:#a6bdcc}.ice{fill:#77d8f7}.gold{fill:#ffbd73}.mint{fill:#9de1b8}.pink{fill:#e9a5b2}.wall{fill:#27323a;stroke:#91a8b5;stroke-width:3}.camera{fill:#77d8f7;stroke:#0b141d;stroke-width:2}.cameraSight{stroke:#77d8f7;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#blue)}.frame{fill:#121c27;stroke:#405361;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1340" height="880" fill="#0c151e"/>
  <text x="40" y="53" class="title">Main Street / The place where Phil waits</text>
  <text x="41" y="83" class="sub">Overhead blocking · S00 morning weather and brush-off · S05 tire, pen, signature and departure</text>
