<text x="344" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">actor / travel</text>
<line x1="489" y1="568" x2="531" y2="568" stroke="#a14f43" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#route)"/>
<text x="545" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">movement</text>
<text x="40" y="606" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">The driver sits forward on the north side. The entry steps open on the southeast curb side.</text>
