<text x="840" y="166" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#136e90" text-anchor="start">CAMERA AND BLOCKING</text>
<text x="840" y="200" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C1 · Window seat</text>
<text x="840" y="222" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Eyes at 1.18 m. Body faces east. Head</text>
<text x="840" y="241" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">turned toward the right-hand glass.</text>
<text x="840" y="260" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Keep the seat in front and window jamb.</text>
<text x="840" y="294" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Street outside</text>
<text x="840" y="316" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Snowy two-lane road; bare utility poles,</text>
<text x="840" y="335" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">slush on the lower glass, winter fields.</text>
<text x="840" y="354" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">No aerial or chase-car photograph.</text>
<text x="840" y="388" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Light and movement</text>
<text x="840" y="410" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Grey daylight enters from the right.</text>
<text x="840" y="429" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Later motion carries roadside objects</text>
<text x="840" y="448" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">toward the rear of the moving bus.</text>
<line x1="38" y1="545" x2="1142" y2="545" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
