<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 570" role="img"><title>Rialto projection booth</title><desc>S04-D2  /  A working window gives the audience a destination across the snow.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed2cf"/></marker></defs><rect width="1020" height="570" fill="#102128"/><style>text{font-family:Helvetica,Arial,sans-serif;fill:#f5efdf}.small{font-size:14px;fill:#bdd0ce}.note{font-size:17px}.big{font-size:32px;font-weight:700}.k{font-size:13px;fill:#85d9d4;letter-spacing:2px}</style><text x="38" y="40" class="k">LOCATION DEPARTMENT   /   OVERHEAD</text><text x="38" y="87" class="big">Rialto projection booth</text><text x="38" y="114" class="small">S04-D2  /  A working window gives the audience a destination across the snow.</text><rect x="40" y="155" width="580" height="345" fill="#1b343a" stroke="#bad1ce" stroke-width="3"/><path d="M165 155 H315" fill="none" stroke="#72cad8" stroke-width="8" stroke-dasharray=""/><text x="170" y="182" class="small">Working window to roofs</text><rect x="118" y="216" width="128" height="65" fill="#45595c" stroke="#91a8a8" stroke-width="3"/><text x="126" y="238" class="small">Projector</text><rect x="318" y="215" width="237" height="63" fill="#655845" stroke="#91a8a8" stroke-width="3"/><text x="326" y="237" class="small">Tape deck · lamp · cue sheet</text><rect x="455" y="398" width="132" height="50" fill="#45595c" stroke="#91a8a8" stroke-width="3"/><text x="463" y="420" class="small">Reel cabinet</text><circle cx="345" cy="309" r="10" fill="#e8a977"/><text x="360" y="314" class="small">Larry</text><circle cx="486" cy="307" r="10" fill="#e8a977"/><text x="501" y="312" class="small">Rita</text><text x="78" y="420" class="small">C1 · shoulder height</text><path d="M150 405 L400 284" fill="none" stroke="#6ed2cf" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M140 500 H215" fill="none" stroke="#102128" stroke-width="7" stroke-dasharray=""/><text x="150" y="486" class="small">hall door</text><text x="655" y="167" class="k">FRAME AND MOVEMENT</text><text x="655" y="207" class="note">C1 looks northeast across the worktop.</text><text x="655" y="230" class="note">The window stays at picture left.</text><text x="655" y="270" class="note">Larry offers the cassette. Rita reads</text><text x="655" y="293" class="note">the cue while she reaches for it.</text><text x="655" y="333" class="note">The lamp picks out hands and tape.</text><text x="655" y="356" class="note">Save the on-air light for the station.</text><text x="655" y="396" class="note">Alma’s voice belongs to the recording.</text><text x="655" y="419" class="note">Play her room tone under the splice.</text><text x="40" y="543" class="small">↑ North       •  cast mark       – – →  camera or eyeline       Opening in wall = entrance</text></svg>
