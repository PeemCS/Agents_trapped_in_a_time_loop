<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img"><title>Pittsburgh terminal payphone</title><desc>Arrivals open on the west. The phone is bolted to the north tile wall, just east of the high glass.</desc><defs><marker id="camera" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#136e90"/></marker><marker id="person" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28735e"/></marker><marker id="route" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a14f43"/></marker><marker id="compass" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17242c"/></marker></defs>
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#faf8f1" stroke="none" stroke-width="2"/>
<text x="38" y="40" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#136e90" text-anchor="start">SET PLAN  •  S02</text>
<text x="38" y="79" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#17242c" text-anchor="start">Pittsburgh terminal payphone</text>
<text x="40" y="107" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#48606a" text-anchor="start">Arrivals open on the west. The phone is bolted to the north tile wall, just east of the high glass.</text>
<line x1="38" y1="127" x2="1142" y2="127" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
<rect x="105" y="197" width="630" height="264" rx="0" fill="#efeade" stroke="#17242c" stroke-width="4"/><line x1="212" y1="197" x2="305" y2="197" stroke="#76aabb" stroke-width="6" stroke-dasharray="none"/><line x1="212" y1="197" x2="305" y2="197" stroke="#faf8f1" stroke-width="1" stroke-dasharray="none"/><line x1="351" y1="197" x2="445" y2="197" stroke="#76aabb" stroke-width="6" stroke-dasharray="none"/><line x1="351" y1="197" x2="445" y2="197" stroke="#faf8f1" stroke-width="1" stroke-dasharray="none"/><line x1="105" y1="311" x2="105" y2="360" stroke="#faf8f1" stroke-width="8" stroke-dasharray="none"/><rect x="503" y="203" width="148" height="36" rx="0" fill="#81949a" stroke="#17242c" stroke-width="2"/><rect x="513" y="209" width="32" height="26" rx="0" fill="#3c4744" stroke="#17242c" stroke-width="2"/><rect x="551" y="210" width="56" height="19" rx="0" fill="#b9c7bd" stroke="#17242c" stroke-width="2"/><text x="574" y="158" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="middle">fixed single payphone</text><line x1="574" y1="164" x2="574" y2="204" stroke="#48606a" stroke-width="1" stroke-dasharray="none"/><rect x="237" y="391" width="144" height="25" rx="0" fill="#9b7753" stroke="#17242c" stroke-width="2"/><text x="310" y="441" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#48606a" text-anchor="middle">terminal bench</text><rect x="668" y="344" width="42" height="81" rx="0" fill="#8c9290" stroke="#17242c" stroke-width="2"/><text x="690" y="389" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#17242c" text-anchor="middle">bin</text><polygon points="558,283 474,208 645,208" fill="#136e90" fill-opacity="0.1" stroke="#136e90" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="558" y1="283" x2="566" y2="241" stroke="#136e90" stroke-width="2" stroke-dasharray="none" marker-end="url(#camera)"/><circle cx="558" cy="283" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="558" y="287" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C1</text><path d="M82 336 L327 336 Q407 336 447 310 L528 291" stroke="#28735e" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#person)"/><text x="131" y="300" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">gate passage</text><text x="202" y="181" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#48606a" text-anchor="start">dirty northern clerestory</text><line x1="769" y1="217" x2="769" y2="186" stroke="#17242c" stroke-width="2" stroke-dasharray="none" marker-end="url(#compass)"/><text x="769" y="178" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17242c" text-anchor="middle">N</text>
<line x1="811" y1="148" x2="811" y2="526" stroke="#c4c9c0" stroke-width="1" stroke-dasharray="none"/>
<text x="840" y="166" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#136e90" text-anchor="start">CAMERA AND BLOCKING</text>
<text x="840" y="200" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C1 · At the phone</text>
<text x="840" y="222" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Standing eye height 1.64 m, north-facing.</text>
<text x="840" y="241" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Receiver cradle is left of the metal keypad.</text>
<text x="840" y="260" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Receiver rests left; silver watch stays visible.</text>
<text x="840" y="294" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Door-to-phone route</text>
<text x="840" y="316" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">West gate behind him on his left; bag bin</text>
<text x="840" y="335" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">and fixed bench south of the phone.</text>
<text x="840" y="354" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Jo is heard only if the take records her.</text>
<text x="840" y="388" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Light and wear</text>
<text x="840" y="410" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Steel-green fluorescent and blue dusk.</text>
<text x="840" y="429" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Anchor one chipped tile above the cradle</text>
<text x="840" y="448" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">and a yellowed directory under the shelf.</text>
<line x1="38" y1="545" x2="1142" y2="545" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
<text x="40" y="572" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#48606a" text-anchor="start">PLAN KEY</text>
<circle cx="144" cy="568" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="144" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C</text>
<text x="165" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">camera / eyes</text>
<circle cx="323" cy="568" r="13" fill="#28735e" stroke="#faf8f1" stroke-width="2"/><text x="323" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">R</text>
<text x="344" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">actor / travel</text>
<line x1="489" y1="568" x2="531" y2="568" stroke="#a14f43" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#route)"/>
<text x="545" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">movement</text>
<text x="40" y="606" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">The phone and handset cord stay on the same wall. Wet dark terrazzo distinguishes this terminal from the town depot.</text>
</svg>
