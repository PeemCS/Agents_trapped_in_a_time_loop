  <title id="t">Hotel to Rialto, evening roofline</title>
  <desc id="d">Exterior camera from an adjoining roof. The hotel's three-sided bay is foreground left. A dark gap representing a whole block separates it from the rear working window of the Rialto on the right. Cut to a second camera inside the booth.</desc>
