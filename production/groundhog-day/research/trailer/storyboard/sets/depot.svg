<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img"><title>Town depot and platform</title><desc>Plan north is the shelter glass. The coach boards beyond the opening in the east wall.</desc><defs><marker id="camera" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#136e90"/></marker><marker id="person" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#28735e"/></marker><marker id="route" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#a14f43"/></marker><marker id="compass" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#17242c"/></marker></defs>
<rect x="0" y="0" width="1180" height="640" rx="0" fill="#faf8f1" stroke="none" stroke-width="2"/>
<text x="38" y="40" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#136e90" text-anchor="start">SET PLAN  •  S01 / S02</text>
<text x="38" y="79" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#17242c" text-anchor="start">Town depot and platform</text>
<text x="40" y="107" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#48606a" text-anchor="start">Plan north is the shelter glass. The coach boards beyond the opening in the east wall.</text>
<line x1="38" y1="127" x2="1142" y2="127" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
<rect x="100" y="197" width="635" height="232" rx="0" fill="#efeade" stroke="#17242c" stroke-width="4"/><line x1="179" y1="197" x2="275" y2="197" stroke="#76aabb" stroke-width="6" stroke-dasharray="none"/><line x1="179" y1="197" x2="275" y2="197" stroke="#faf8f1" stroke-width="1" stroke-dasharray="none"/><line x1="349" y1="197" x2="445" y2="197" stroke="#76aabb" stroke-width="6" stroke-dasharray="none"/><line x1="349" y1="197" x2="445" y2="197" stroke="#faf8f1" stroke-width="1" stroke-dasharray="none"/><line x1="735" y1="263" x2="735" y2="320" stroke="#faf8f1" stroke-width="8" stroke-dasharray="none"/><rect x="140" y="393" width="179" height="22" rx="0" fill="#9b7753" stroke="#17242c" stroke-width="2"/><text x="229" y="448" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#48606a" text-anchor="middle">slatted bench / south wall</text><polygon points="229,389 132,213 355,213" fill="#136e90" fill-opacity="0.1" stroke="#136e90" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="229" y1="382" x2="229" y2="280" stroke="#136e90" stroke-width="2" stroke-dasharray="none" marker-end="url(#camera)"/><circle cx="229" cy="389" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="229" y="393" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C1</text><text x="118" y="175" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">platform shelter / north-facing glass</text><rect x="591" y="216" width="80" height="22" rx="0" fill="#c5cdca" stroke="#17242c" stroke-width="2"/><text x="631" y="231" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#17242c" text-anchor="middle">timetable</text><path d="M473 366 L560 366 Q601 366 633 338 L740 287" stroke="#a14f43" stroke-width="3" fill="none" stroke-dasharray="7 4" marker-end="url(#route)"/><polygon points="549,335 712,243 749,314" fill="#136e90" fill-opacity="0.1" stroke="#136e90" stroke-width="1.3" stroke-dasharray="6 5"/><line x1="560" y1="330" x2="700" y2="291" stroke="#136e90" stroke-width="2" stroke-dasharray="none" marker-end="url(#camera)"/><circle cx="549" cy="335" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="549" y="339" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C2</text><text x="675" y="354" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#48606a" text-anchor="start">east exit</text><text x="376" y="405" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">grey terrazzo</text><line x1="764" y1="214" x2="764" y2="183" stroke="#17242c" stroke-width="2" stroke-dasharray="none" marker-end="url(#compass)"/><text x="764" y="175" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17242c" text-anchor="middle">N</text>
<line x1="811" y1="148" x2="811" y2="526" stroke="#c4c9c0" stroke-width="1" stroke-dasharray="none"/>
<text x="840" y="166" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#136e90" text-anchor="start">CAMERA AND BLOCKING</text>
<text x="840" y="200" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C1 · Empty bench</text>
<text x="840" y="222" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Seated eye height 1.17 m; torso faces</text>
<text x="840" y="241" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">north. Foreground knees anchor the cut.</text>
<text x="840" y="260" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">North windows carry grey evening snow.</text>
<text x="840" y="294" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">C2 · Boarding</text>
<text x="840" y="316" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Standing eye height 1.64 m; approach</text>
<text x="840" y="335" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">the east exit. Door handle is frame-right.</text>
<text x="840" y="354" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Use the same timetable as in C1.</text>
<text x="840" y="388" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#17242c" text-anchor="start">Sound geography</text>
<text x="840" y="410" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Ballroom music in S01 is an editorial</text>
<text x="840" y="429" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">sound bridge. Keep the depot empty.</text>
<line x1="38" y1="545" x2="1142" y2="545" stroke="#bcc4bc" stroke-width="1" stroke-dasharray="none"/>
<text x="40" y="572" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#48606a" text-anchor="start">PLAN KEY</text>
<circle cx="144" cy="568" r="13" fill="#136e90" stroke="#faf8f1" stroke-width="2"/><text x="144" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">C</text>
<text x="165" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">camera / eyes</text>
<circle cx="323" cy="568" r="13" fill="#28735e" stroke="#faf8f1" stroke-width="2"/><text x="323" y="572" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">R</text>
<text x="344" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">actor / travel</text>
<line x1="489" y1="568" x2="531" y2="568" stroke="#a14f43" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#route)"/>
<text x="545" y="573" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#17242c" text-anchor="start">movement</text>
<text x="40" y="606" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#48606a" text-anchor="start">Bench and timetable stay put through both visits. Evening is the missed dance. Daylight is a later Tuesday’s coach.</text>
</svg>
