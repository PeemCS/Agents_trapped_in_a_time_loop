<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 570" role="img"><title>Regional station control room</title><desc>S06-A  /  A separate location. Rita has carried Alma’s finished piece here.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ed2cf"/></marker></defs><rect width="1020" height="570" fill="#102128"/><style>text{font-family:Helvetica,Arial,sans-serif;fill:#f5efdf}.small{font-size:14px;fill:#bdd0ce}.note{font-size:17px}.big{font-size:32px;font-weight:700}.k{font-size:13px;fill:#85d9d4;letter-spacing:2px}</style><text x="38" y="40" class="k">LOCATION DEPARTMENT   /   OVERHEAD</text><text x="38" y="87" class="big">Regional station control room</text><text x="38" y="114" class="small">S06-A  /  A separate location. Rita has carried Alma’s finished piece here.</text><rect x="40" y="155" width="580" height="345" fill="#1b343a" stroke="#bad1ce" stroke-width="3"/><path d="M130 155 H295" fill="none" stroke="#72cad8" stroke-width="8" stroke-dasharray=""/><text x="149" y="182" class="small">Control glass</text><rect x="198" y="210" width="302" height="73" fill="#655845" stroke="#91a8a8" stroke-width="3"/><text x="206" y="232" class="small">Source deck      Switcher      VU meters</text><rect x="475" y="345" width="116" height="64" fill="#45595c" stroke="#91a8a8" stroke-width="3"/><text x="483" y="367" class="small">Patch rack</text><circle cx="330" cy="311" r="10" fill="#e8a977"/><text x="345" y="316" class="small">Rita · faces north</text><text x="74" y="398" class="small">C1 · left shoulder</text><path d="M152 390 L345 268" fill="none" stroke="#6ed2cf" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><path d="M570 500 H610" fill="none" stroke="#102128" stroke-width="8" stroke-dasharray=""/><text x="480" y="476" class="small">corridor exit</text><text x="655" y="167" class="k">FRAME AND MOVEMENT</text><text x="655" y="207" class="note">Rita owns the switch. Leave room</text><text x="655" y="230" class="note">in depth for the return monitor.</text><text x="655" y="270" class="note">The tape rolls as her finger moves.</text><text x="655" y="293" class="note">One small meter catches on a syllable.</text><text x="655" y="333" class="note">The job ends here. Cut across time</text><text x="655" y="356" class="note">to the ballroom with a chair scrape.</text><text x="655" y="396" class="note">Rita has her coat. Phil has no view</text><text x="655" y="419" class="note">of either the switch or the lobby.</text><text x="40" y="543" class="small">↑ North       •  cast mark       – – →  camera or eyeline       Opening in wall = entrance</text></svg>
