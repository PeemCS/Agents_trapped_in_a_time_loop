nputs unplugged."},"input_sha256":"1fbc4e1a4ebe720888132b4fa4a64927782fba8474743d263e604a684e2b4907"},{"time":"19:00","place":"regional control room","speaker":"Rita","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"You're putting that in my mouth, Larry, and I'm not signing off on it. Air the tape. Let them hear it. That's the last reel, so we run the last breath, whether you like it or not.","effect":"Rita airs the old recording of Phil giving the weather.","id":"d03-b16","seen":["d03-b02","d03-b03","d03-b04","d03-b06","d03-b07","d03-b08","d03-b09","d03-b10","d03-b14","d03-b15"],"earlier_turns_recalled":[],"cue":"Seven o'clock. Make the patch or let the slot go. Anything you say is to Larry and Alma inside the control room.","choice":"weather","choices":{"silence":"Rita lets the seven o’clock slot pass in silence.","weather":"Rita airs the old recording of Phil giving the weather."},"input_sha256":"799dbfeeab4648d1f72d7c60fdb7e6c92fe5bffdd87e1ea4fe6e2a3b1a7b4765"},{"time":"19:01","place":"regional control room","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Phil is dead, Larry. The air does not keep talking.","effect":"Alma takes her coat.","id":"d03-b17","seen":["d03-b06","d03-b07","d03-b08","d03-b09","d03-b10","d03-b14","d03-b15","d03-b16"],"earlier_turns_recalled":[],"cue":"The slot is gone. Say what you want Rita and Larry to hear before you take your coat.","choice":"leave","choices":{"leave":"Alma takes her coat."},"input_sha256":"6fc228c9fedf76c88f249e637c1de2fb8d74e5fbebea414c6df507f7f40885c7"},{"time":"22:16","place":"Hearthside stairwell","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"That's enough. Static's winning tonight, so I'm done.","effect":"Phil cuts the recording short.","id":"d03-b18","seen":["d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13"],"earlier_turns_recalled":["d01-b01","d01-b02","d01-b03","d01-b04","d01-b05","d01-b11","d01-b12","d01-b13","d01-b14","d01-b19","d02-b01","d02-b02","d02-b03","d02-b04","d02-b05","d02-b11","d02-b13","d02-b18"],"cue":"At seven you tuned to the regional frequency. What you heard: You hear your own old voice on AM, right down to the intake of breath. Now, hours later, the pocket recorder clicks on in your hand. Leave a private voice memo for morning about the part of today you can still hear. Speak as Phil, or play out the silence. Before this Tuesday you remember 2 complete days in this run ending before you could reach Wednesday breakfast.","choice":"cut","choices":{"keep":"Phil lets the last recording play to the end.","cut":"Phil cuts the recording short."},"input_sha256":"0edb94d6141df39367516395064539a6f5302a6a53754181b9103ca0768707ac"}],"wire":"weather","syrup":"leave"},{"day":4,"events":[{"time":"06:00","place":"Hearthside room","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"There it is, wrapped and waiting. Jo, if you're there, it's on the dresser, and I'm not taking it with me.","effect":"Phil leaves the wrapped bottle on the hotel dresser.","id":"d04-b01","seen":[],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d02-b01","d02-b02","d02-b03","d02-b04","d02-b05","d02-b11","d02-b13","d02-b18","d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13","d03-b18"],"cue":"The radio clicks on. Tuesday, February 2. Your clean shirt is folded exactly as the hotel left it. Record a voice memo nobody else can hear. It can be for Jo, for tomorrow's you, or for nobody at all. The small bottle of maple syrup is back on the dresser, wrapped and unopened. Choose what you physically do with it. The recorder is running. Before this Tuesday you remember 3 complete days in this run ending before you could reach Wednesday breakfast.","choice":"leave","choices":{"pack":"Phil tucks the unopened maple syrup into his travel bag.","leave":"Phil leaves the wrapped bottle on the hotel dresser.","open":"Phil opens the bottle for himself this morning.","pour_out":"Phil em ep your breath, Phil, I'll find my own way to talk to the audience. I'm not letting the Rialto close on a lie.","effect":"Rita clips the yellow carbon back under her sheet.","id":"d05-b03","seen":["d05-b02"],"earlier_turns_recalled":[],"cue":"You just saw Phil at the cue sheet. Speak to him or to Larry, or let the moment go.","choice":"keep_carbon","choices":{"tear_carbon":"Rita gives Phil the yellow carbon copy of the cue sheet.","keep_carbon":"Rita clips the yellow carbon back under her sheet."},"input_sha256":"2ce42ffe5596c047b3ebf1c8f92e365825ac891a45c26c7c8719fb53d0f8bac5"},{"time":"07:22","place":"Hearthside lobby","speaker":"Larry","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Phil, that tape's gone. I'm not holding up the lobby.","effect":"Larry picks up the equipment case.","id":"d05-b04","seen":["d05-b02","d05-b03"],"earlier_turns_recalled":[],"cue":"You're beside Rita. Phil can hear you. You can answer either one. The crew still has to get the equipment across the street.","choice":"take_case","choices":{"take_case":"Larry picks up the equipment case.","set_down":"Larry sets the equipment case on the floor."},"input_sha256":"e1dcff684b5444e9be856caf93ac74b4211925b42ab515b67f1aab8eb1c9e804"},{"time":"12:54","place":"coach stop","speaker":"Phil","witnesses":["Phil"],"kind":"dialogue","line":"I am not taking the elevator, and I am not looking at that phone. I need to hear my own footsteps before I go under.","effect":"Hearthside stairwell","id":"d05-b05","seen":["d05-b01","d05-b02","d05-b03","d05-b04"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13","d03-b18","d04-b01","d04-b02","d04-b03","d04-b04","d04-b05","d04-b11","d04-b13","d04-b18"],"cue":"The coach door is open. The projection booth across the street has a service door. There is a stairwell at the hotel where the radio can't be heard. Go where you actually want to go. You can speak under your breath. Before t mo","line":"It's on the dresser, not in the bag. I'm done fighting for things that don't stay.","effect":"Phil leaves the wrapped bottle on the hotel dresser.","id":"d29-b01","seen":[],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d27-b01","d27-b02","d27-b03","d27-b04","d27-b05","d27-b11","d27-b13","d27-b18","d28-b01","d28-b02","d28-b03","d28-b04","d28-b05","d28-b11","d28-b13","d28-b18"],"cue":"The radio clicks on. Tuesday, February 2. Your clean shirt is folded exactly as the hotel left it. Record a voice memo nobody else can hear. It can be for Jo, for tomorrow's you, or for nobody at all. The small bottle of maple syrup is back on the dresser, wrapped and unopened. Choose what you physically do with it. The recorder is running. Before this Tuesday you remember 28 complete days in this run ending before you could reach Wednesday breakfast.","choice":"leave","choices":{"pack":"Phil tucks the unopened maple syrup into his travel bag.","leave":"Phil leaves the wrapped bottle on the hotel dresser.","open":"Phil opens the bottle for himself this morning.","pour_out":"Phil empties the bottle into the hotel sink."},"input_sha256":"ec69d77ad73713d4c14975b3b2b56094bc392f424ddf63e764cd7fb77953ee15"},{"time":"07:20","place":"Hearthside lobby","speaker":"Phil","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Leave it. I don't need my voice in the room to remember it's Wednesday.","effect":"Phil leaves the weather cartridge by the cue sheet, unmarked.","id":"d29-b02","seen":["d29-b01"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d27-b01","d27-b02","d27-b03","d27-b04","d27-b05","d27-b11","d27-b13","d27-b18","d28-b01","d28-b02","d28-b03","d28-b04","d28-b05","d28-b11","d28-b13","d28-b18"],"cue":"Rita and Larry wait at the cue sheet. Beside it is the only weather cartridge: your own cheerful voice doing an old forecast, down t b10","d35-b14","d35-b15","d35-b16"],"earlier_turns_recalled":[],"cue":"The microphone is live. Your voice is going over local AM. You cannot know who is listening.","choice":"speak","choices":{"speak":"Alma has the live microphone."},"input_sha256":"655058f6abeb9ec13e74de49d3909ea8e3608154897aaf0bdaec6fb2069738e8"},{"time":"22:16","place":"Rialto service door","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"It’s just the hum, Jo. Eight o'clock, sharp, and the syrup is in the bag.","effect":"Phil lets the last recording play to the end.","id":"d35-b18","seen":["d35-b01","d35-b02","d35-b03","d35-b04","d35-b05","d35-b11","d35-b12","d35-b13"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d33-b01","d33-b02","d33-b03","d33-b04","d33-b05","d33-b11","d33-b13","d33-b18","d34-b01","d34-b02","d34-b03","d34-b04","d34-b05","d34-b11","d34-b12","d34-b13","d34-b18"],"cue":"At seven you tuned to the regional frequency. What you heard: The AM radio carries Alma saying: Turn that off, Rita. I am listening to the tape, not to your schedule. Now, hours later, the pocket recorder clicks on in your hand. Leave a private voice memo for morning about the part of today you can still hear. Speak as Phil, or play out the silence. Before this Tuesday you remember 34 complete days in this run ending before you could reach Wednesday breakfast.","choice":"keep","choices":{"keep":"Phil lets the last recording play to the end.","cut":"Phil cuts the recording short."},"input_sha256":"ec391f1ee8f6c04aa95b9f7012c806d98c9fe4606f2dea563f2b2808dc6759c3"}],"wire":"public","syrup":"pack"}]</script>
<script>
const days=JSON.parse(document.getElementById('record').textContent);
const byId=id=>document.getElementById(id);
const menu=byId('day'),filter=byId('filter'),search=byId('query');
for(const day of days)menu.add(new Option('Tuesday '+day.day,String(day.day)));
menu.add(new Option('All Tuesdays','all'));
const params=new URLSearchParams(location.hash.slice(1));
if([...menu.options].some(o=>o.value===params.get('day')))menu.value=params.get('day');
if([...filter.options].some(o=>o.value===params.get('view')))filter.value=params.get('view');
function element(tag,cls,words){const el=document.createElement(tag);el.className=cls;el.textContent=words;return el}
const turns=new Map(),receivers=new Map();
for(const day of days){for(const e of day.events){turns.set(e.id,{day:day.day,e});for(const id of [...e.seen,...e.earlier_turns_recalled]){if(!receivers.has(id))receivers.set(id,new Map());const map=receivers.get(id);if(!map.has(e.speaker))map.set(e.speaker,e.id)}}}
function turnLink(id){
 const {day,e}=turns.get(id);const a=element('a','','Tuesday '+day+' · '+e.time+' · '+e.speaker);
 a.href='#'+new URLSearchParams({day,view:'all',turn:id});
 a.onclick=ev=>{ev.preventDefault();menu.value=String(day);filter.value='all';search.value='';change();history.replaceState(null,'',a.href);document.getElementById(id)?.scrollIntoView({block:'center'})};return a
}
function references(box,title,ids){
 if(!ids.length)return;
 const details=element('details','',''),summary=element('summary','',title+' ('+ids.length+')'),list=element('ul','','');
 details.addEventListener('toggle',()=>{if(!details.open||list.childElementCount)return;for(const id of ids){const li=element('li','','');li.append(turnLink(id),document.createTextNode(' — '+(turns.get(id).e.line||'(Silence.)')));list.append(li)}});
 details.append(summary,list);box.append(details)
}
function traceBox(e){
 const box=element('aside','trace','');box.append(element('h3','','Decision trace'));
 const ids=e.seen,recall=e.earlier_turns_recalled,previous=ids.length?turns.get(ids.at(-1)).e:null;
 if(previous)box.append(element('p','','Last witnessed turn: '+previous.speaker+' at '+previous.time+' — '+(previous.line||previous.effect)));
 else if(e.speaker==='Phil'&&recall.length)box.append(element('p','','Last recalled turn: '+(turns.get(recall.at(-1)).e.line||turns.get(recall.at(-1)).e.effect)));
 else box.append(element('p','',e.speaker+' begins this scene without an earlier turn from today.'));
 box.append(element('p','','Selected action: '+e.effect));
 if(e.commentary){const note=element('p','','After-scene recollection · '+e.speaker+' — '+e.commentary.line+' ');if(turns.has(e.commentary.source))note.append(document.createTextNode('Cited turn: '),turnLink(e.commentary.source));else note.append(document.createTextNode(e.commentary.source==='scene'?'(Cites the scene.)':'(Cites their own line.)'));box.append(note)}
 const next=receivers.get(e.id);
 if(next){const row=element('p','','Next turns that include this event: ');let i=0;for(const id of next.values()){if(i++)row.append(document.createTextNode(' · '));row.append(turnLink(id))}box.append(row)}
 const setup=element('details','','');setup.append(element('summary','','Situation and '+Object.keys(e.choices).length+' available '+(Object.keys(e.choices).length===1?'action':'actions')),element('p','',e.cue));
 const menuList=element('ul','','');for(const [key,text] of Object.entries(e.choices))menuList.append(element('li','',(key===e.choice?'Chosen — ':'')+text));setup.append(menuList);box.append(setup);
 references(box,'What this character witnessed today',ids);references(box,'Earlier moments in this character’s memory',recall);
 return box
}
function show(){
 const view=filter.value, q=search.value.trim().toLowerCase(), selection=menu.value;
 const fragment=document.createDocumentFragment();let count=0;
 for(const day of days){
  if(selection!=='all'&&day.day!==Number(selection))continue;
  for(const e of day.events){
   if(view==='memo'&&e.kind!=='voice memo')continue;
   if(view==='away'&&e.witnesses.includes('Phil'))continue;
   if(!['all','memo','away'].includes(view)&&e.speaker!==view)continue;
   if(q&&!e.line.toLowerCase().includes(q))continue;
   const card=element('article',e.kind==='voice memo'?'memo':'','');card.id=e.id;
   const meta=element('div','meta','');meta.append(element('div','eyeline','TUESDAY '+day.day+'  /  '+e.time),element('h2','',e.speaker),element('div','location',e.place));
   const copy=element('div','copy','');copy.append(element('p','speech',e.line||'(Silence.)'),element('p','effect',e.effect),element('small','who',e.kind==='voice memo'?'Private voice memo':'Heard by '+e.witnesses.join(', ')));
   if(byId('trace').checked)copy.append(traceBox(e));
   card.append(meta,copy);fragment.append(card);count++;
  }
 }
 if(!count)fragment.append(element('p','empty','No matching lines.'));
 byId('lines').replaceChildren(fragment);
 byId('status').textContent=count+' recorded '+(count===1?'turn':'turns')+(selection==='all'?' across '+days.length+' Tuesdays':' on Tuesday '+selection);
 byId('prev').disabled=selection==='all'||Number(selection)<=1;byId('next').disabled=selection==='all'||Number(selection)>=days.length;
}
function change(){history.replaceState(null,'','#'+new URLSearchParams({day:menu.value,view:filter.value}));show()}
byId('trace').onchange=show;menu.onchange=change;filter.onchange=change;search.oninput=show;byId('prev').onclick=()=>{menu.value=String(Number(menu.value)-1);change()};byId('next').onclick=()=>{menu.value=String(Number(menu.value)+1);change()};show();
const firstTurn=params.get('turn');
if(firstTurn)requestAnimationFrame(()=>document.getElementById(firstTurn)?.scrollIntoView({block:'center'}));
</script>
</html>
