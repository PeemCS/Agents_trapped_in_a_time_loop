nputs unplugged."},"input_sha256":"1fbc4e1a4ebe720888132b4fa4a64927782fba8474743d263e604a684e2b4907"},{"time":"19:00","place":"regional control room","speaker":"Rita","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"You're putting that in my mouth, Larry, and I'm not signing off on it. Air the tape. Let them hear it. That's the last reel, so we run the last breath, whether you like it or not.","effect":"Rita airs the old recording of Phil giving the weather.","id":"d03-b16","seen":["d03-b02","d03-b03","d03-b04","d03-b06","d03-b07","d03-b08","d03-b09","d03-b10","d03-b14","d03-b15"],"earlier_turns_recalled":[],"cue":"Seven o'clock. Make the patch or let the slot go. Anything you say is to Larry and Alma inside the control room.","choice":"weather","choices":{"silence":"Rita lets the seven o’clock slot pass in silence.","weather":"Rita airs the old recording of Phil giving the weather."},"input_sha256":"799dbfeeab4648d1f72d7c60fdb7e6c92fe5bffdd87e1ea4fe6e2a3b1a7b4765"},{"time":"19:01","place":"regional control room","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Phil is dead, Larry. The air does not keep talking.","effect":"Alma takes her coat.","id":"d03-b17","seen":["d03-b06","d03-b07","d03-b08","d03-b09","d03-b10","d03-b14","d03-b15","d03-b16"],"earlier_turns_recalled":[],"cue":"The slot is gone. Say what you want Rita and Larry to hear before you take your coat.","choice":"leave","choices":{"leave":"Alma takes her coat."},"input_sha256":"6fc228c9fedf76c88f249e637c1de2fb8d74e5fbebea414c6df507f7f40885c7"},{"time":"22:16","place":"Hearthside stairwell","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"That's enough. Static's winning tonight, so I'm done.","effect":"Phil cuts the recording short.","id":"d03-b18","seen":["d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13"],"earlier_turns_recalled":["d01-b01","d01-b02","d01-b03","d01-b04","d01-b05","d01-b11","d01-b12","d01-b13","d01-b14","d01-b19","d02-b01","d02-b02","d02-b03","d02-b04","d02-b05","d02-b11","d02-b13","d02-b18"],"cue":"At seven you tuned to the regional frequency. What you heard: You hear your own old voice on AM, right down to the intake of breath. Now, hours later, the pocket recorder clicks on in your hand. Leave a private voice memo for morning about the part of today you can still hear. Speak as Phil, or play out the silence. Before this Tuesday you remember 2 complete days in this run ending before you could reach Wednesday breakfast.","choice":"cut","choices":{"keep":"Phil lets the last recording play to the end.","cut":"Phil cuts the recording short."},"input_sha256":"0edb94d6141df39367516395064539a6f5302a6a53754181b9103ca0768707ac"}],"wire":"weather","syrup":"leave"},{"day":4,"events":[{"time":"06:00","place":"Hearthside room","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"There it is, wrapped and waiting. Jo, if you're there, it's on the dresser, and I'm not taking it with me.","effect":"Phil leaves the wrapped bottle on the hotel dresser.","id":"d04-b01","seen":[],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d02-b01","d02-b02","d02-b03","d02-b04","d02-b05","d02-b11","d02-b13","d02-b18","d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13","d03-b18"],"cue":"The radio clicks on. Tuesday, February 2. Your clean shirt is folded exactly as the hotel left it. Record a voice memo nobody else can hear. It can be for Jo, for tomorrow's you, or for nobody at all. The small bottle of maple syrup is back on the dresser, wrapped and unopened. Choose what you physically do with it. The recorder is running. Before this Tuesday you remember 3 complete days in this run ending before you could reach Wednesday breakfast.","choice":"leave","choices":{"pack":"Phil tucks the unopened maple syrup into his travel bag.","leave":"Phil leaves the wrapped bottle on the hotel dresser.","open":"Phil opens the bottle for himself this morning.","pour_out":"Phil em ep your breath, Phil, I'll find my own way to talk to the audience. I'm not letting the Rialto close on a lie.","effect":"Rita clips the yellow carbon back under her sheet.","id":"d05-b03","seen":["d05-b02"],"earlier_turns_recalled":[],"cue":"You just saw Phil at the cue sheet. Speak to him or to Larry, or let the moment go.","choice":"keep_carbon","choices":{"tear_carbon":"Rita gives Phil the yellow carbon copy of the cue sheet.","keep_carbon":"Rita clips the yellow carbon back under her sheet."},"input_sha256":"2ce42ffe5596c047b3ebf1c8f92e365825ac891a45c26c7c8719fb53d0f8bac5"},{"time":"07:22","place":"Hearthside lobby","speaker":"Larry","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Phil, that tape's gone. I'm not holding up the lobby.","effect":"Larry picks up the equipment case.","id":"d05-b04","seen":["d05-b02","d05-b03"],"earlier_turns_recalled":[],"cue":"You're beside Rita. Phil can hear you. You can answer either one. The crew still has to get the equipment across the street.","choice":"take_case","choices":{"take_case":"Larry picks up the equipment case.","set_down":"Larry sets the equipment case on the floor."},"input_sha256":"e1dcff684b5444e9be856caf93ac74b4211925b42ab515b67f1aab8eb1c9e804"},{"time":"12:54","place":"coach stop","speaker":"Phil","witnesses":["Phil"],"kind":"dialogue","line":"I am not taking the elevator, and I am not looking at that phone. I need to hear my own footsteps before I go under.","effect":"Hearthside stairwell","id":"d05-b05","seen":["d05-b01","d05-b02","d05-b03","d05-b04"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d03-b01","d03-b02","d03-b03","d03-b04","d03-b05","d03-b11","d03-b13","d03-b18","d04-b01","d04-b02","d04-b03","d04-b04","d04-b05","d04-b11","d04-b13","d04-b18"],"cue":"The coach door is open. The projection booth across the street has a service door. There is a stairwell at the hotel where the radio can't be heard. Go where you actually want to go. You can speak under your breath. Before t mo","line":"It's on the dresser, not in the bag. I'm done fighting for things that don't stay.","effect":"Phil leaves the wrapped bottle on the hotel dresser.","id":"d29-b01","seen":[],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d27-b01","d27-b02","d27-b03","d27-b04","d27-b05","d27-b11","d27-b13","d27-b18","d28-b01","d28-b02","d28-b03","d28-b04","d28-b05","d28-b11","d28-b13","d28-b18"],"cue":"The radio clicks on. Tuesday, February 2. Your clean shirt is folded exactly as the hotel left it. Record a voice memo nobody else can hear. It can be for Jo, for tomorrow's you, or for nobody at all. The small bottle of maple syrup is back on the dresser, wrapped and unopened. Choose what you physically do with it. The recorder is running. Before this Tuesday you remember 28 complete days in this run ending before you could reach Wednesday breakfast.","choice":"leave","choices":{"pack":"Phil tucks the unopened maple syrup into his travel bag.","leave":"Phil leaves the wrapped bottle on the hotel dresser.","open":"Phil opens the bottle for himself this morning.","pour_out":"Phil empties the bottle into the hotel sink."},"input_sha256":"ec69d77ad73713d4c14975b3b2b56094bc392f424ddf63e764cd7fb77953ee15"},{"time":"07:20","place":"Hearthside lobby","speaker":"Phil","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Leave it. I don't need my voice in the room to remember it's Wednesday.","effect":"Phil leaves the weather cartridge by the cue sheet, unmarked.","id":"d29-b02","seen":["d29-b01"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d27-b01","d27-b02","d27-b03","d27-b04","d27-b05","d27-b11","d27-b13","d27-b18","d28-b01","d28-b02","d28-b03","d28-b04","d28-b05","d28-b11","d28-b13","d28-b18"],"cue":"Rita and Larry wait at the cue sheet. Beside it is the only weather cartridge: your own cheerful voice doing an old forecast, down t obby","speaker":"Phil","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"It's mine. Eight o'clock, sharp.","effect":"Phil pockets the station's only copy of his old weather recording.","id":"d48-b02","seen":["d48-b01"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d46-b01","d46-b02","d46-b03","d46-b04","d46-b05","d46-b11","d46-b13","d46-b18","d47-b01","d47-b02","d47-b03","d47-b04","d47-b05","d47-b11","d47-b13","d47-b18"],"cue":"Rita and Larry wait at the cue sheet. Beside it is the only weather cartridge: your own cheerful voice doing an old forecast, down to a small breath before your first word. At seven, it can substitute for you on air. Do something with it while they can see. They can hear anything you say. Before this Tuesday you remember 47 complete days in this run ending before you could reach Wednesday breakfast.","choice":"pocket_cart","choices":{"pocket_cart":"Phil pockets the station's only copy of his old weather recording.","mark_archive":"Phil writes ARCHIVE across the weather cartridge and leaves it by the cue sheet.","leave_cart":"Phil leaves the weather cartridge by the cue sheet, unmarked."},"input_sha256":"f83f76a5a583ec3f0159387f24bf74f7155ce833ac96d08ea1917af612f9445f"},{"time":"07:21","place":"Hearthside lobby","speaker":"Rita","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Phil, you just stole the weather segment? Don't make me route it.","effect":"Rita clips the yellow carbon back under her sheet.","id":"d48-b03","seen":["d48-b02"],"earlier_turns_recalled":[],"cue":"You just saw Phil at the cue sheet. Speak to him or to Larry, or let the moment go.","choice":"keep_carbon","choices":{"tear_carbon":"Rita gives Phil the yellow carbon copy of the cue sheet.","keep_carbon":"Rita clips the yellow carbon back under her sheet."},"input_sha256":"5b7c98b7b1b34f959da2b074e229a4e8ebc9a34a1c9336bdf alogue","line":"Rita, you got the key? Good. Don't ask me about the line to Pittsburgh, just get that crate out of my way before I trip.","effect":"Alma cuts the projector motor.","id":"d48-b06","seen":[],"earlier_turns_recalled":[],"cue":"The door is shut. Only Rita and Larry are with you. You have the key; the last reel has eight minutes left. They can bring a microphone, give you one private line to Nell, or pack up. You have not given permission. Open the conversation however you like.","choice":"stop_motor","choices":{"stop_motor":"Alma cuts the projector motor.","keep_running":"Alma leaves the projector turning."},"input_sha256":"0983fdf9873a3e80274d2a3c01357775eb377ef3e16a4d0cb97344a03f701562"},{"time":"13:08","place":"locked Rialto booth","speaker":"Larry","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Rita, did you clip the carbon back under that sheet when he grabbed it? Just so I know what the master actually is.","effect":"Larry turns the reel box over and writes on its blank label.","id":"d48-b07","seen":["d48-b02","d48-b03","d48-b04","d48-b06"],"earlier_turns_recalled":[],"cue":"Speak to Alma or Rita. They were not both at the hotel desk. You decide what to repeat, if anything. You have a pencil and an empty reel box.","choice":"write_label","choices":{"write_label":"Larry turns the reel box over and writes on its blank label.","put_down":"Larry puts down his pencil."},"input_sha256":"f21ed504b06328ce28935a39d2a6f7868cea5b73e60ca073b8a9014e8bd7b698"},{"time":"13:09","place":"locked Rialto booth","speaker":"Rita","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"The carbon is under the sheet, Larry, so leave the master alone. And if the Pittsburgh line isn't my problem, the crate isn't mine to move.","effect":"Rita stays by the closed door.","id":"d48-b08","seen":["d48-b02","d48-b03","d48-b04","d48-b06","d48-b07"],"earlier_turns_recalled":[],"cue":"Alma and Larry are here with you. Their words are still in the room. There is exactly one line at seven. Ask for something you actually need, or refuse what's being asked.","choice":"stay_door","choices":{"draw_chair":"Rita pulls a chair over to Alma.","stay_door":"Rita stays by the closed door."},"input_sha256":"8bbddf7f1f2b605cae21d36dc586ac09d42a3601ef3fd30b872669d181478464"},{"time":"13:10","place":"locked Rialto booth","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Larry, stop marking that box, it's not a shipment. Rita, I am not moving the crate, but I will not leave this room with the door locked.","effect":"Alma permits either the public microphone or a private call.","id":"d48-b09","seen":["d48-b06","d48-b07","d48-b08"],"earlier_turns_recalled":[],"cue":"Answer the people here. You can reserve your voice for Nell, let people hear it publicly as well, or withhold it altogether. Their jobs do not oblige you to help.","choice":"public_too","choices":{"family_only":"Alma permits only a private call to Nell.","public_too":"Alma permits either the public microphone or a private call.","decline":"Alma declines both lines."},"input_sha256":"7d92d072321cc251ca67a46e1d4d8f856161a449693f19e66545c0cf24d6fb79"},{"time":"13:11","place":"locked Rialto booth","speaker":"Larry","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Here. Don't get tripped up by your own stuff, Alma. Rita, you're on point, just stay by the door.","effect":"Larry holds the door for Alma.","id":"d48-b10","seen":["d48-b02","d48-b03","d48-b04","d48-b06","d48-b07","d48-b08","d48-b09"],"earlier_turns_recalled":[],"cue":"One last thing you could say to either of them before the reel runs out.","choice":"hold_door","choices":{"hold_door":"Larry holds the door for Alma.","stay_put":"Larry stays by the projector."},"input_sha256":"590f77480adfa26cae31d91c907c12b2a49502bd7a7ba5d7652c0c7d80fc1d4f"},{"time":"16:40","place":"Hearthside stairwell","speaker":"Phil","witnesses":["Phil","Jo"],"kind":"dialogue","line":"Jo, the couch is still where I left it. Eight o'clock, sharp.","effect":"Jo answers the call.","id":"d48-b11","seen":["d48-b01","d48-b02","d48-b03","d48-b04","d48-b05"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d46-b01","d46-b02","d46-b03","d46-b04","d46-b05","d46-b11","d46-b13","d46-b18","d47-b01","d47-b02","d47-b03","d47-b04","d47-b05","d47-b11","d47-b13","d47-b18"],"cue":"There is a telephone here. You can ring Jo in Pittsburgh, or let her have the afternoon to herself. If you call, say what she hears when she picks up. If you leave it alone, keep the line empty. Before this Tuesday you remember 47 complete days in this run ending before you could reach Wednesday breakfast.","choice":"dial","choices":{"dial":"Jo answers the call.","walk_past":"Phil walks past the phone."},"input_sha256":"214e0c52933f3571f0a721fe09ea499a61f3b8fae3e2aeec7e4754cf1e16cfa0"},{"time":"16:41","place":"telephone line","speaker":"Jo","witnesses":["Phil","Jo"],"kind":"dialogue","line":"It's still where you left it, Phil, except one leg's jammed under the frame and I can't pry it out by myself. Are you actually coming over, or is that just the forecast?","effect":"Jo stays on the line for another beat.","id":"d48-b12","seen":["d48-b11"],"earlier_turns_recalled":[],"cue":"Phil is on the telephone. You don't see his surroundings. One couch foot is still stuck. Answer him as you please.","choice":"stay","choices":{"stay":"Jo stays on the line for another beat.","hang_up":"Jo hangs up."},"input_sha256":"ca3c2e6efff841ee76913cdee1214b442f46de44784dcd1a7472b57d0c6ae122"},{"time":"18:48","place":"Hearthside stairwell","speaker":"Phil","witnesses":["Phil"],"kind":"dialogue","line":"I'm not calling. Eight o'clock, sharp.","effect":"Phil puts the handset back.","id":"d48-b13","seen":["d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12"],"earlier_turns_recalled":["d01-b01","d01-b12 er recording.","id":"d50-b02","seen":["d50-b01"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12","d48-b13","d48-b18","d49-b01","d49-b02","d49-b03","d49-b04","d49-b05","d49-b11","d49-b12","d49-b13","d49-b14","d49-b19"],"cue":"Rita and Larry wait at the cue sheet. Beside it is the only weather cartridge: your own cheerful voice doing an old forecast, down to a small breath before your first word. At seven, it can substitute for you on air. Do something with it while they can see. They can hear anything you say. Before this Tuesday you remember 49 complete days in this run ending before you could reach Wednesday breakfast.","choice":"pocket_cart","choices":{"pocket_cart":"Phil pockets the station's only copy of his old weather recording.","mark_archive":"Phil writes ARCHIVE across the weather cartridge and leaves it by the cue sheet.","leave_cart":"Phil leaves the weather cartridge by the cue sheet, unmarked."},"input_sha256":"dd15611e94de0c0a2ec978abf88ce6394f1896dea520b99303ab81a53594049d"},{"time":"07:21","place":"Hearthside lobby","speaker":"Rita","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"You keep the carbon. \"Phil. That tape is the station's, not yours. And you don't get to pick what goes out at seven.\"","effect":"Rita clips the yellow carbon back under her sheet.","id":"d50-b03","seen":["d50-b02"],"earlier_turns_recalled":[],"cue":"You just saw Phil at the cue sheet. Speak to him or to Larry, or let the moment go.","choice":"keep_carbon","choices":{"tear_carbon":"Rita gives Phil the yellow carbon copy of the cue sheet.","keep_carbon":"Rita clips the yellow carbon back under her sheet."},"input_sha256":"48dc6e68b79f28fe4ac42664ac92740ea748a5a28b08f25a9cd40eb2955f81a3"},{"time":"07:22","place":"Hearthside lobby","speaker":"Larry","witnesses":["Phil","Rita","Larry"],"kind":"dialogue","line":"Phil's got the tape, so we're going. Come on, the mic's in the car.","effect":"Larry picks up the equipment case.","id":"d50-b04","seen":["d50-b02","d50-b03"],"earlier_turns_recalled":[],"cue":"You're beside Rita. Phil can hear you. You can answer either one. The crew still has to get the equipment across the street.","choice":"take_case","choices":{"take_case":"Larry picks up the equipment case.","set_down":"Larry sets the equipment case on the floor."},"input_sha256":"2addb3f67885a728c5d703f9f771ecc11e5fd32048dfcef59a2f0bf24aca950e"},{"time":"12:54","place":"coach stop","speaker":"Phil","witnesses":["Phil"],"kind":"dialogue","line":"Rita said the Rialto closes tonight. You don't get to just vanish because a couch has a bad leg, do you?","effect":"Rialto service door","id":"d50-b05","seen":["d50-b01","d50-b02","d50-b03","d50-b04"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12","d48-b13","d48-b18","d49-b01","d49-b02","d49-b03","d49-b04","d49-b05","d49-b11","d49-b12","d49-b13","d49-b14","d49-b19"],"cue":"The coach door is open. The projection booth across the street has a service door. There is a stairwell at the hotel where the radio can't be heard. Go where you actually want to go. You can speak under your breath. Before this Tuesday you remember 49 complete days in this run ending before you could reach Wednesday breakfast.","choice":"booth","choices":{"coach":"Pittsburgh terminal","hotel":"Hearthside stairwell","booth":"Rialto service door"},"input_sha256":"10048f9dee691b6152ca56f710b848b5aea9d0aaef3554b79bd23726b099e404"},{"time":"13:07","place":"locked Rialto booth","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Eight minutes left. Don't touch the door.","effect":"Alma leaves the projector turning.","id":"d50-b06","seen":[],"earlier_turns_recalled":[],"cue":"The door is shut. Only Rita and Larry are with you. You have the key; the last reel has eight minutes left. They can bring a microphone, give you one private line to Nell, or pack up. You have not given permission. Open the conversation however you like.","choice":"keep_running","choices":{"stop_motor":"Alma cuts the projector motor.","keep_running":"Alma leaves the projector turning."},"input_sha256":"7347bed0ed5bc053cbe4246bcc83b3c7a89ba0ebf94be7dc4dd11cc1953c74a0"},{"time":"13:08","place":"locked Rialto booth","speaker":"Larry","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"She’s counting down, Rita. Just keep your eye on the projector.","effect":"Larry puts down his pencil.","id":"d50-b07","seen":["d50-b02","d50-b03","d50-b04","d50-b06"],"earlier_turns_recalled":[],"cue":"Speak to Alma or Rita. They were not both at the hotel desk. You decide what to repeat, if anything. You have a pencil and an empty reel box.","choice":"put_down","choices":{"write_label":"Larry turns the reel box over and writes on its blank label.","put_down":"Larry puts down his pencil."},"input_sha256":"5f1d1ea3f1c731d7969af0b84f0d0eb29eb86b5fbfab784c72e78f8372f09531"},{"time":"13:09","place":"locked Rialto booth","speaker":"Rita","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Alma, stop the projector. I'm not watching a countdown, I'm picking a piece, so cut the lights.","effect":"Rita stays by the closed door.","id":"d50-b08","seen":["d50-b02","d50-b03","d50-b04","d50-b06","d50-b07"],"earlier_turns_recalled":[],"cue":"Alma and Larry are here with you. Their words are still in the room. There is exactly one line at seven. Ask for something you actually need, or refuse what's being asked.","choice":"stay_door","choices":{"draw_chair":"Rita pulls a chair over to Alma.","stay_door":"Rita stays by the closed door."},"input_sha256":"6d8fa4551201556e3d0bcb2fe11cbb258783eac6f8f9c3333274f541ad129c19"},{"time":"13:10","place":"locked Rialto booth","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"I said don't touch the door. Sit still.","effect":"Alma declines both lines.","id":"d50-b09","seen":["d50-b06","d50-b07","d50-b08"],"earlier_turns_recalled":[],"cue":"Answer the people here. You can reserve your voice for Nell, let people hear it publicly as well, or withhold it altogether. Their jobs do not oblige you to help.","choice":"decline","choices":{"family_only":"Alma permits only a private call to Nell.","public_too":"Alma permits either the public microphone or a private call.","decline":"Alma declines both lines."},"input_sha256":"645b190a8817a7fee686969999ab2282a749c397d384fe5b7c958b735f18a038"},{"time":"13:11","place":"locked Rialto booth","speaker":"Larry","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"She's not going to stop it, Rita. Just breathe.","effect":"Larry stays by the projector.","id":"d50-b10","seen":["d50-b02","d50-b03","d50-b04","d50-b06","d50-b07","d50-b08","d50-b09"],"earlier_turns_recalled":[],"cue":"One last thing you could say to either of them before the reel runs out.","choice":"stay_put","choices":{"hold_door":"Larry holds the door for Alma.","stay_put":"Larry stays by the projector."},"input_sha256":"47876228e3daf39bfc0441b8a273f714a103cd6b3cbed0225d77aabb072ba00f"},{"time":"16:40","place":"Rialto service door","speaker":"Phil","witnesses":["Phil","Jo"],"kind":"dialogue","line":"It's me. The leg is jammed, I know what to do. I'm driving.","effect":"Jo answers the call.","id":"d50-b11","seen":["d50-b01","d50-b02","d50-b03","d50-b04","d50-b05"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12","d48-b13","d48-b18","d49-b01","d49-b02","d49-b03","d49-b04","d49-b05","d49-b11","d49-b12","d49-b13","d49-b14","d49-b19"],"cue":"There is a telephone here. You can ring Jo in Pittsburgh, or let her have the afternoon to herself. If you call, say what she hears when she picks up. If you leave it alone, keep the line empty. Before this Tuesday you remember 49 complete days in this run ending before you could reach Wednesday breakfast.","choice":"dial","choices":{"dial":"Jo answers the call.","walk_past":"Phil walks past the phone."},"input_sha256":"07ed8638ba17da6143ae19d5f4081bf1c13463b349b1b211279c98563655295b","commentary":{"line":"I wanted to stop treating this like a forecast and just show up to fix the damn leg.","source":"d48-b12"}},{"time":"16:41","place":"telephone line","speaker":"Jo","witnesses":["Phil","Jo"],"kind":"dialogue","line":"If you're driving, you'll make it by eight, right? I'm making pancakes on the blue griddle.","effect":"Jo hangs up.","id":"d50-b12","seen":["d50-b11"],"earlier_turns_recalled":[],"cue":"Phil is on the telephone. You don't see his surroundings. One couch foot is still stuck. Answer him as you please.","choice":"hang_up","choices":{"stay":"Jo stays on the line for another beat.","hang_up":"Jo hangs up."},"input_sha256":"a452590fb296ff3b657518b3ed958d268e9faf6d1819c56251811c134a5c1445"},{"time":"18:48","place":"Rialto service door","speaker":"Phil","witnesses":["Phil"],"kind":"dialogue","line":"Eight o'clock, sharp. I'm not losing another day to your static.","effect":"Phil puts the handset back.","id":"d50-b13","seen":["d50-b01","d50-b02","d50-b03","d50-b04","d50-b05","d50-b11","d50-b12"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12","d48-b13","d48-b18","d49-b01","d49-b02","d49-b03","d49-b04","d49-b05","d49-b11","d49-b12","d49-b13","d49-b14","d49-b19"],"cue":"A town phone directory gives the regional station's desk number. You can call Ri leaves both inputs unplugged."},"input_sha256":"f172fbc67f4e9b9b4a817eeddc1b25b16b52abbd2af1322fe938871d9d5f99e2"},{"time":"19:00","place":"regional control room","speaker":"Rita","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"So we're just letting it go dark? Fine.","effect":"Rita lets the seven o’clock slot pass in silence.","id":"d50-b16","seen":["d50-b02","d50-b03","d50-b04","d50-b06","d50-b07","d50-b08","d50-b09","d50-b10","d50-b14","d50-b15"],"earlier_turns_recalled":[],"cue":"Seven o'clock. Make the patch or let the slot go. Anything you say is to Larry and Alma inside the control room.","choice":"silence","choices":{"silence":"Rita lets the seven o’clock slot pass in silence."},"input_sha256":"c0b349e588ce99f4180a1cc5b339b8d4479dbcdba65ca8ccf6eb864724291408"},{"time":"19:01","place":"regional control room","speaker":"Alma","witnesses":["Alma","Rita","Larry"],"kind":"dialogue","line":"Pick the one that makes you cry. Don't pick the one that sells. Go on, get out of my light.","effect":"Alma takes her coat.","id":"d50-b17","seen":["d50-b06","d50-b07","d50-b08","d50-b09","d50-b10","d50-b14","d50-b15","d50-b16"],"earlier_turns_recalled":[],"cue":"The slot is gone. Say what you want Rita and Larry to hear before you take your coat.","choice":"leave","choices":{"leave":"Alma takes her coat."},"input_sha256":"701e0c6eeda2da96e134ba33dce28240e204978435a68d2bc8f69d3fc1523c30"},{"time":"22:16","place":"Rialto service door","speaker":"Phil","witnesses":["Phil"],"kind":"voice memo","line":"Cut it. Eight o'clock, sharp.","effect":"Phil cuts the recording short.","id":"d50-b18","seen":["d50-b01","d50-b02","d50-b03","d50-b04","d50-b05","d50-b11","d50-b12","d50-b13"],"earlier_turns_recalled":["d01-b01","d01-b12","d01-b19","d07-b01","d07-b19","d14-b01","d14-b18","d21-b01","d21-b18","d28-b01","d28-b18","d35-b01","d35-b18","d42-b01","d42-b18","d48-b01","d48-b02","d48-b03","d48-b04","d48-b05","d48-b11","d48-b12","d48-b13","d48-b18","d49-b01","d49-b02","d49-b03"," <script>
const days=JSON.parse(document.getElementById('record').textContent);
const byId=id=>document.getElementById(id);
const menu=byId('day'),filter=byId('filter'),search=byId('query');
for(const day of days)menu.add(new Option('Tuesday '+day.day,String(day.day)));
menu.add(new Option('All Tuesdays','all'));
const params=new URLSearchParams(location.hash.slice(1));
if([...menu.options].some(o=>o.value===params.get('day')))menu.value=params.get('day');
if([...filter.options].some(o=>o.value===params.get('view')))filter.value=params.get('view');
function element(tag,cls,words){const el=document.createElement(tag);el.className=cls;el.textContent=words;return el}
const turns=new Map(),receivers=new Map();
for(const day of days){for(const e of day.events){turns.set(e.id,{day:day.day,e});for(const id of [...e.seen,...e.earlier_turns_recalled]){if(!receivers.has(id))receivers.set(id,new Map());const map=receivers.get(id);if(!map.has(e.speaker))map.set(e.speaker,e.id)}}}
function turnLink(id){
 const {day,e}=turns.get(id);const a=element('a','','Tuesday '+day+' · '+e.time+' · '+e.speaker);
 a.href='#'+new URLSearchParams({day,view:'all',turn:id});
 a.onclick=ev=>{ev.preventDefault();menu.value=String(day);filter.value='all';search.value='';change();history.replaceState(null,'',a.href);document.getElementById(id)?.scrollIntoView({block:'center'})};return a
}
function references(box,title,ids){
 if(!ids.length)return;
 const details=element('details','',''),summary=element('summary','',title+' ('+ids.length+')'),list=element('ul','','');
 details.addEventListener('toggle',()=>{if(!details.open||list.childElementCount)return;for(const id of ids){const li=element('li','','');li.append(turnLink(id),document.createTextNode(' — '+(turns.get(id).e.line||'(Silence.)')));list.append(li)}});
 details.append(summary,list);box.append(details)
}
function traceBox(e){
 const box=element('aside','trace','');box.append(element('h3','','Decision trace'));
 const ids=e.seen,recall=e.earlier_turns_recalled,previous=ids.length?turns.get(ids.at(-1)).e:null;
 if(previous)box.append(element('p','','Last witnessed turn: '+previous.speaker+' at '+previous.time+' — '+(previous.line||previous.effect)));
 else if(e.speaker==='Phil'&&recall.length)box.append(element('p','','Last recalled turn: '+(turns.get(recall.at(-1)).e.line||turns.get(recall.at(-1)).e.effect)));
 else box.append(element('p','',e.speaker+' begins this scene without an earlier turn from today.'));
 box.append(element('p','','Selected action: '+e.effect));
 if(e.commentary){const note=element('p','','After-scene recollection · '+e.speaker+' — '+e.commentary.line+' ');if(turns.has(e.commentary.source))note.append(document.createTextNode('Cited turn: '),turnLink(e.commentary.source));else note.append(document.createTextNode(e.commentary.source==='scene'?'(Cites the scene.)':'(Cites their own line.)'));box.append(note)}
 const next=receivers.get(e.id);
 if(next){const row=element('p','','Next turns that include this event: ');let i=0;for(const id of next.values()){if(i++)row.append(document.createTextNode(' · '));row.append(turnLink(id))}box.append(row)}
 const setup=element('details','','');setup.append(element('summary','','Situation and '+Object.keys(e.choices).length+' available '+(Object.keys(e.choices).length===1?'action':'actions')),element('p','',e.cue));
 const menuList=element('ul','','');for(const [key,text] of Object.entries(e.choices))menuList.append(element('li','',(key===e.choice?'Chosen — ':'')+text));setup.append(menuList);box.append(setup);
 references(box,'What this character witnessed today',ids);references(box,'Earlier moments in this character’s memory',recall);
 return box
}
function show(){
 const view=filter.value, q=search.value.trim().toLowerCase(), selection=menu.value;
 const fragment=document.createDocumentFragment();let count=0;
 for(const day of days){
  if(selection!=='all'&&day.day!==Number(selection))continue;
  for(const e of day.events){
   if(view==='memo'&&e.kind!=='voice memo')continue;
   if(view==='away'&&e.witnesses.includes('Phil'))continue;
   if(!['all','memo','away'].includes(view)&&e.speaker!==view)continue;
   if(q&&!e.line.toLowerCase().includes(q))continue;
   const card=element('article',e.kind==='voice memo'?'memo':'','');card.id=e.id;
   const meta=element('div','meta','');meta.append(element('div','eyeline','TUESDAY '+day.day+'  /  '+e.time),element('h2','',e.speaker),element('div','location',e.place));
   const copy=element('div','copy','');copy.append(element('p','speech',e.line||'(Silence.)'),element('p','effect',e.effect),element('small','who',e.kind==='voice memo'?'Private voice memo':'Heard by '+e.witnesses.join(', ')));
   if(byId('trace').checked)copy.append(traceBox(e));
   card.append(meta,copy);fragment.append(card);count++;
  }
 }
 if(!count)fragment.append(element('p','empty','No matching lines.'));
 byId('lines').replaceChildren(fragment);
 byId('status').textContent=count+' recorded '+(count===1?'turn':'turns')+(selection==='all'?' across '+days.length+' Tuesdays':' on Tuesday '+selection);
 byId('prev').disabled=selection==='all'||Number(selection)<=1;byId('next').disabled=selection==='all'||Number(selection)>=days.length;
}
function change(){history.replaceState(null,'','#'+new URLSearchParams({day:menu.value,view:filter.value}));show()}
byId('trace').onchange=show;menu.onchange=change;filter.onchange=change;search.oninput=show;byId('prev').onclick=()=>{menu.value=String(Number(menu.value)-1);change()};byId('next').onclick=()=>{menu.value=String(Number(menu.value)+1);change()};show();
const firstTurn=params.get('turn');
if(firstTurn)requestAnimationFrame(()=>document.getElementById(firstTurn)?.scrollIntoView({block:'center'}));
</script>
</html>
